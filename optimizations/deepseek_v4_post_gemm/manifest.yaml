operator: deepseek_v4_post_gemm

baseline:
  id: legacy_row_split
  implementation: csrc/deepseek_v4_post_gemm_stage.cpp
  entrypoint: deepseek_v4_post_gemm_parallel_stage_prepacked
  status: reference
  selection: FUSED_CPP_POST_GEMM_M8_ALIGNED=0

features:
  - id: schedule.m8_aligned
    part: schedule
    status: enabled
    implementation: csrc/deepseek_v4_post_gemm_stage.cpp
    hypothesis: >-
      Partitioning M as complete M8 panels removes the M4/M2 per-thread tails
      produced by ceil(M / threads) while retaining the existing packed
      weights, GEMM kernels, output layouts, and one OpenMP region per GEMM.
    depends_on: []
    conflicts_with: []
    selection: >-
      Enabled by default on AArch64. FUSED_CPP_POST_GEMM_M8_ALIGNED=0 restores
      the legacy row split for correctness and performance comparisons.
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_deepseek_v4_post_gemm_stage.py
      -k m8_aligned_matches_legacy
    benchmark: >-
      PYTHONPATH=src FUSED_CPP_ATTN_GEMM_BACKEND=neon
      OMP_NUM_THREADS=96 OMP_DYNAMIC=FALSE OMP_PROC_BIND=close
      OMP_PLACES=cores numactl --physcpubind=0-95 --membind=0
      .venv/bin/python tests/bench_deepseek_v4_post_gemm_stage.py
      --m 2048 --threads 96 --warmup 3 --runs 15 --schedule m8
    result: >-
      optimizations/deepseek_v4_post_gemm/results/amazon_192c_m8_aligned_20260729.md

  - id: runtime.shared_q_gemm_pool
    part: runtime
    status: enabled
    implementation: csrc/deepseek_v4_post_gemm_stage.cpp
    hypothesis: >-
      Running Main Q and Indexer Q in one OpenMP region lets M8-panel workers
      balance across both GEMMs and removes one region transition without
      changing packed weights, kernels, output layouts, or postprocessing.
    depends_on:
      - schedule.m8_aligned
    conflicts_with: []
    selection: >-
      Auto-enabled on AArch64 with OpenMP when threads >= 32 and each GEMM has
      at least one M8 panel per thread. FUSED_CPP_POST_GEMM_SHARED_Q_POOL=0
      disables it; any non-false value forces it for experiments.
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_deepseek_v4_post_gemm_stage.py
      -k shared_q_pool_matches_sequential
    benchmark: >-
      PYTHONPATH=src FUSED_CPP_POST_GEMM_BACKEND=neon
      OMP_NUM_THREADS=96 OMP_DYNAMIC=FALSE OMP_PROC_BIND=close
      OMP_PLACES=cores numactl --physcpubind=0-95 --membind=0
      .venv/bin/python tests/bench_deepseek_v4_post_gemm_stage.py
      --m 2048 --threads 96 --warmup 5 --runs 31
      --schedule m8 --q-pool shared
    result: >-
      optimizations/deepseek_v4_post_gemm/results/amazon_192c_shared_q_pool_20260729.md

  - id: schedule.q_gemm_mn_groups
    part: schedule
    status: candidate
    implementation: csrc/deepseek_v4_post_gemm_stage.cpp
    hypothesis: >-
      Splitting each Q GEMM packed-B matrix into owner-first N stripes keeps a
      worker's active B window near private-L2 capacity and multiplies the
      available M8-panel tasks, while preserving the packed-weight format,
      microkernels, output layout and postprocessing order.
    depends_on:
      - schedule.m8_aligned
      - runtime.shared_q_gemm_pool
    conflicts_with: []
    selection: >-
      Experimental opt-in through FUSED_CPP_POST_GEMM_N_GROUPS=<total groups>,
      where the value must be at least two. The default remains two groups.
      FUSED_CPP_POST_GEMM_SHARED_Q_POOL=1 forces the required shared pool.
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_deepseek_v4_post_gemm_stage.py
      -k q_mn_groups
    benchmark: >-
      PYTHONPATH=src FUSED_CPP_POST_GEMM_BACKEND=neon
      OMP_NUM_THREADS=96 OMP_DYNAMIC=FALSE OMP_PROC_BIND=close
      OMP_PLACES=cores numactl --physcpubind=0-95 --membind=0
      .venv/bin/python tests/bench_deepseek_v4_post_gemm_stage.py
      --m 2048 --threads 96 --warmup 5 --runs 31
      --schedule m8 --q-pool shared --n-groups 32
    result: >-
      optimizations/deepseek_v4_post_gemm/results/amazon_192c_q_gemm_mn_groups_20260729.md

variants:
  - id: post_gemm_m8_aligned
    entrypoint: deepseek_v4_post_gemm_parallel_stage_prepacked
    status: enabled
    features:
      - schedule.m8_aligned

  - id: post_gemm_shared_q_pool
    entrypoint: deepseek_v4_post_gemm_parallel_stage_prepacked
    status: enabled
    features:
      - schedule.m8_aligned
      - runtime.shared_q_gemm_pool

  - id: post_gemm_q_gemm_mn_groups
    entrypoint: deepseek_v4_post_gemm_parallel_stage_prepacked
    status: candidate
    features:
      - schedule.m8_aligned
      - runtime.shared_q_gemm_pool
      - schedule.q_gemm_mn_groups
