operator: deepseek_v4_post_gemm

baseline:
  id: legacy_row_split
  implementation: csrc/deepseek_v4_post_gemm_stage.cpp
  entrypoint: deepseek_v4_post_gemm_parallel_stage_prepacked
  status: reference
  selection: FUSED_CPP_POST_GEMM_M8_ALIGNED=0

features:
  - id: dispatch.indexer_select_all_early_exit
    part: dispatch
    status: enabled
    implementation: csrc/deepseek_v4_post_gemm_stage.cpp
    hypothesis: >-
      Detecting that every sparse-indexer row selects its complete valid range
      before the Q branches run removes the otherwise unused Indexer Q GEMM and
      Indexer Q RoPE/weight scaling, while preserving Main Q, both compressor
      updates, the final TopK buffer contents, and the long-path dispatch.
    depends_on: []
    conflicts_with: []
    selection: >-
      Enabled automatically when num_tokens is positive and
      max(cu_seqlen_ke - cu_seqlen_ks) is no larger than topk_tokens. The
      select-all indices are still written after both compressors. All other
      inputs retain the existing score and TopK path.
    correctness: >-
      PYTHONPATH=src OMP_NUM_THREADS=8 OMP_DYNAMIC=FALSE
      OMP_PROC_BIND=close OMP_PLACES=cores taskset -c 0-7
      .venv/bin/python -m pytest -q
      tests/test_deepseek_v4_post_gemm_stage.py
    benchmark: >-
      PYTHONPATH=src FUSED_CPP_POST_GEMM_BACKEND=neon
      OMP_NUM_THREADS=8 OMP_DYNAMIC=FALSE OMP_PROC_BIND=close
      OMP_PLACES=cores taskset -c 0-7
      .venv/bin/python tests/bench_deepseek_v4_post_gemm_stage.py
      --m 2048 --context-start 0 --threads 8 --warmup 3 --runs 15
      --schedule m8 --q-pool auto --profile
    result: >-
      optimizations/deepseek_v4_post_gemm/results/amazon_8c_indexer_select_all_early_exit_20260813.md

  - id: schedule.m8_aligned
    part: schedule
    status: enabled
    implementation: csrc/deepseek_v4_post_gemm_stage.cpp
    hypothesis: >-
      Partitioning M as complete M8 panels removes the M4/M2 per-thread tails
      produced by ceil(M / threads) while retaining the existing packed
      weights, GEMM kernels, output layouts, and one OpenMP region per GEMM.
    depends_on: []
    conflicts_with: []
    selection: >-
      Enabled by default on AArch64. FUSED_CPP_POST_GEMM_M8_ALIGNED=0 restores
      the legacy row split for correctness and performance comparisons.
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_deepseek_v4_post_gemm_stage.py
      -k m8_aligned_matches_legacy
    benchmark: >-
      PYTHONPATH=src FUSED_CPP_ATTN_GEMM_BACKEND=neon
      OMP_NUM_THREADS=96 OMP_DYNAMIC=FALSE OMP_PROC_BIND=close
      OMP_PLACES=cores numactl --physcpubind=0-95 --membind=0
      .venv/bin/python tests/bench_deepseek_v4_post_gemm_stage.py
      --m 2048 --threads 96 --warmup 3 --runs 15 --schedule m8
    result: >-
      optimizations/deepseek_v4_post_gemm/results/amazon_192c_m8_aligned_20260729.md

  - id: runtime.shared_q_gemm_pool
    part: runtime
    status: enabled
    implementation: csrc/deepseek_v4_post_gemm_stage.cpp
    hypothesis: >-
      Running Main Q and Indexer Q in one OpenMP region lets M8-panel workers
      balance across both GEMMs and removes one region transition without
      changing packed weights, kernels, output layouts, or postprocessing.
    depends_on:
      - schedule.m8_aligned
    conflicts_with: []
    selection: >-
      Auto-enabled on AArch64 with OpenMP when threads >= 32 and each GEMM has
      at least one M8 panel per thread. FUSED_CPP_POST_GEMM_SHARED_Q_POOL=0
      disables it; any non-false value forces it for experiments.
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_deepseek_v4_post_gemm_stage.py
      -k shared_q_pool_matches_sequential
    benchmark: >-
      PYTHONPATH=src FUSED_CPP_POST_GEMM_BACKEND=neon
      OMP_NUM_THREADS=96 OMP_DYNAMIC=FALSE OMP_PROC_BIND=close
      OMP_PLACES=cores numactl --physcpubind=0-95 --membind=0
      .venv/bin/python tests/bench_deepseek_v4_post_gemm_stage.py
      --m 2048 --threads 96 --warmup 5 --runs 31
      --schedule m8 --q-pool shared
    result: >-
      optimizations/deepseek_v4_post_gemm/results/amazon_192c_shared_q_pool_20260729.md

  - id: schedule.q_gemm_mn_groups
    part: schedule
    status: candidate
    implementation: csrc/deepseek_v4_post_gemm_stage.cpp
    hypothesis: >-
      Splitting each Q GEMM packed-B matrix into owner-first N stripes keeps a
      worker's active B window near private-L2 capacity and multiplies the
      available M8-panel tasks, while preserving the packed-weight format,
      microkernels, output layout and postprocessing order.
    depends_on:
      - schedule.m8_aligned
      - runtime.shared_q_gemm_pool
    conflicts_with: []
    selection: >-
      Experimental opt-in through FUSED_CPP_POST_GEMM_N_GROUPS=<total groups>,
      where the value must be at least two. The default remains two groups.
      FUSED_CPP_POST_GEMM_SHARED_Q_POOL=1 forces the required shared pool.
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_deepseek_v4_post_gemm_stage.py
      -k q_mn_groups
    benchmark: >-
      PYTHONPATH=src FUSED_CPP_POST_GEMM_BACKEND=neon
      OMP_NUM_THREADS=96 OMP_DYNAMIC=FALSE OMP_PROC_BIND=close
      OMP_PLACES=cores numactl --physcpubind=0-95 --membind=0
      .venv/bin/python tests/bench_deepseek_v4_post_gemm_stage.py
      --m 2048 --threads 96 --warmup 5 --runs 31
      --schedule m8 --q-pool shared --n-groups 32
    result: >-
      optimizations/deepseek_v4_post_gemm/results/amazon_192c_q_gemm_mn_groups_20260729.md

  - id: compute.indexer_weighted_relu_sve_8x2vl
    part: compute
    status: candidate
    implementation:
      - csrc/deepseek_v4_indexer_sve.cpp
      - csrc/deepseek_v4_post_gemm_stage.cpp
    hypothesis: >-
      Computing an 8-head by 2VL-key BFMMLA tile entirely in SVE registers,
      then applying headwise ReLU, resident pair weights, and the head reduce
      before the only score store removes the incorrect weighted-Q fold and
      avoids materializing per-head logits. Packing B directly from paged KV
      also removes the fp32 gathered-K tensor.
    depends_on: []
    conflicts_with: []
    selection: >-
      The working candidate dispatches automatically for contiguous bf16 Q/K,
      fp32 weights, H divisible by 8, and D divisible by 4 on SVE BF16 builds.
      Other shapes and non-SVE builds use the headwise weighted-ReLU fp32
      fallback. Amazon 8-core SVL256 correctness, generated-assembly spill
      audit, single-/multi-request integration, and long-path performance are
      validated; SVL128/192-core validation remains before adoption.
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_sparse_attn_indexer.py
      tests/test_deepseek_v4_post_gemm_stage.py
      -k 'relu_before_head_weights or indexer_8x2vl or cpp_matches_torch'
    benchmark: >-
      PYTHONPATH=src OMP_NUM_THREADS=8 OMP_DYNAMIC=FALSE
      OMP_PROC_BIND=close OMP_PLACES=cores taskset -c 0-7
      .venv/bin/python tests/bench_deepseek_v4_post_gemm_stage.py
      --m 2048 --context-start 4096 --threads 8 --warmup 3 --runs 15
      --profile
    result: >-
      optimizations/deepseek_v4_post_gemm/results/amazon_8c_indexer_weighted_relu_sve_20260813.md

  - id: compute.indexer_native_batch_topk
    part: compute
    status: candidate
    implementation:
      - csrc/deepseek_v4_indexer_sve.cpp
      - csrc/deepseek_v4_post_gemm_stage.cpp
    hypothesis: >-
      Replacing 2,048 independent ATen topk calls with one OpenMP batched exact
      selector removes per-row tensor allocation, int32 conversion, dispatch,
      and copy overhead while preserving the score-descending TopK contract.
    depends_on: []
    conflicts_with: []
    selection: >-
      Dispatch automatically for CPU contiguous-row fp32 scores and a
      non-overlapping strided int32 output buffer. Each worker reuses one
      candidate buffer and applies nth_element followed by sorting only the
      selected K entries. Unsupported tensor contracts retain the ATen
      row-wise fallback. Amazon 8-core correctness and performance are
      validated; the 192-core/SVL128 target remains before adoption.
    correctness: >-
      PYTHONPATH=src OMP_NUM_THREADS=8 OMP_DYNAMIC=FALSE
      OMP_PROC_BIND=close OMP_PLACES=cores taskset -c 0-7
      .venv/bin/python -m pytest -q
      tests/test_sparse_attn_indexer.py
      tests/test_deepseek_v4_post_gemm_stage.py
    benchmark: >-
      PYTHONPATH=src OMP_NUM_THREADS=8 OMP_DYNAMIC=FALSE
      OMP_PROC_BIND=close OMP_PLACES=cores taskset -c 0-7
      .venv/bin/python tests/bench_deepseek_v4_post_gemm_stage.py
      --m 2048 --context-start 4096 --threads 8 --warmup 3 --runs 15
      --profile
    result: >-
      optimizations/deepseek_v4_post_gemm/results/amazon_8c_indexer_native_batch_topk_20260813.md

variants:
  - id: post_gemm_indexer_select_all_early_exit
    entrypoint: deepseek_v4_post_gemm_parallel_stage_prepacked
    status: enabled
    features:
      - dispatch.indexer_select_all_early_exit

  - id: post_gemm_m8_aligned
    entrypoint: deepseek_v4_post_gemm_parallel_stage_prepacked
    status: enabled
    features:
      - schedule.m8_aligned

  - id: post_gemm_shared_q_pool
    entrypoint: deepseek_v4_post_gemm_parallel_stage_prepacked
    status: enabled
    features:
      - schedule.m8_aligned
      - runtime.shared_q_gemm_pool

  - id: post_gemm_q_gemm_mn_groups
    entrypoint: deepseek_v4_post_gemm_parallel_stage_prepacked
    status: candidate
    features:
      - schedule.m8_aligned
      - runtime.shared_q_gemm_pool
      - schedule.q_gemm_mn_groups

  - id: post_gemm_indexer_weighted_relu_sve_8x2vl
    entrypoint: deepseek_v4_post_gemm_parallel_stage_prepacked
    status: candidate
    features:
      - compute.indexer_weighted_relu_sve_8x2vl

  - id: post_gemm_indexer_sve_8x2vl_native_batch_topk
    entrypoint: deepseek_v4_post_gemm_parallel_stage_prepacked
    status: candidate
    features:
      - compute.indexer_weighted_relu_sve_8x2vl
      - compute.indexer_native_batch_topk
