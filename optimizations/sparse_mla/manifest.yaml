operator: sparse_mla

baseline:
  id: indexed_4x4
  implementation: csrc/sparse_mla.cpp
  entrypoint: _flash_mla_sparse_fwd_variant(..., "indexed_4x4")
  status: reference

default:
  id: indexed_4x4_2d
  entrypoint: flash_mla_sparse_fwd
  dispatch: >-
    BF16 uses guarded KV splitting when eight-query block count is no more than
    half the requested worker count, with at most eight KV shards per block.
    FP32 and BF16 shapes that do not trigger the guard retain the indexed 1D
    schedule and numerical behavior.

benchmark_scenarios:
  full_forward: >-
    tests/bench_sparse_mla_tail_variants.py --workload v4-forward
    --s-q 2048 --warmup 5 --iters 21
  tail_causal: >-
    tests/bench_sparse_mla_tail_variants.py --workload tail-causal
    --tail-blocks 1024 --warmup 5 --iters 21
  tail_v4_mix: >-
    tests/bench_sparse_mla_tail_variants.py --workload tail-v4-mix
    --tail-blocks 1024 --warmup 5 --iters 21
  dsv4_sparse_4096: >-
    tests/bench_sparse_mla_tail_variants.py --workload dsv4-sparse
    --s-q 4096 --compressed-capacity 512 --window-size 128
    --compress-ratio 4 --warmup 5 --iters 21
  dsv4_sparse_8192: >-
    tests/bench_sparse_mla_tail_variants.py --workload dsv4-sparse
    --s-q 8192 --compressed-capacity 512 --window-size 128
    --compress-ratio 4 --warmup 5 --iters 21
  dense_shared_2048: >-
    tests/bench_sparse_mla_tail_variants.py --workload dense-shared
    --s-q 2048 --dense-kv 640 --h-q 32 --d-qk 192 --d-v 128
    --variants indexed_4x4 heads_dense_8x8 --warmup 3 --iters 11

features:
  - id: scheduling.head_major_dense
    part: scheduling
    status: experimental
    owner: zhangxu
    opened: 2026-08-13
    decision_by: 2026-09-12
    implementation: csrc/sparse_mla.cpp
    hypothesis: >-
      Treating eight heads of one token as the QK/PV M dimension keeps public
      Q/output rows contiguous and creates one independently schedulable task
      per token while continuing to share packed MQA K/V across all heads.
    depends_on: []
    conflicts_with: []
    next_decision: >-
      Keep experimental until representative sequence/head/thread sweeps show
      where finer task granularity outweighs the small single-thread overhead.
    adoption_gate: >-
      At least 5% lower median latency at the selected high-core production
      configuration, no more than 0.5% regression at one thread and eight
      threads in three independent sessions, and unchanged output/stats.
    correctness: >-
      PYTHONPATH=src OMP_NUM_THREADS=4 .venv/bin/python -m pytest -q
      tests/test_sparse_mla.py
    benchmark: >-
      OMP_NUM_THREADS=<threads> OMP_DYNAMIC=FALSE OMP_PROC_BIND=close
      OMP_PLACES=cores taskset -c <cores> env PYTHONPATH=src
      .venv/bin/python tests/bench_sparse_mla_tail_variants.py
      --workload dense-shared --s-q 2048 --dense-kv 640
      --variants indexed_4x4 heads_dense_8x8 --warmup 3 --iters 11
    result: optimizations/sparse_mla/results/arm_head_major_20260813.md

  - id: planning.masked_dense_tail
    part: planning
    status: candidate
    owner: zhangxu
    opened: 2026-08-12
    decision_by: 2026-09-11
    implementation: csrc/sparse_mla.cpp
    hypothesis: >-
      Promoting an eight-query monotonic contiguous tail from indexed 4x4
      tiles to one masked 8x8 tile removes gather-oriented QK and scalar PV
      overhead while preserving duplicate, non-contiguous, partial-query, and
      out-of-range fallback behavior.
    depends_on: []
    conflicts_with: []
    next_decision: >-
      Retire the production-resident comparison path unless repeated target-host
      measurements justify a single-thread-only dispatch or a multi-thread result
      within 0.5% of the indexed baseline.
    adoption_gate: >-
      Pass the focused sparse MLA suite and show at least 5% lower median latency
      at one thread without more than 0.5% regression at 12, 32, or 96 threads
      in three independent 21-run sessions on the 192-core target.
    correctness: >-
      PYTHONPATH=src OMP_NUM_THREADS=12 .venv/bin/python -m pytest -q
      tests/test_sparse_mla.py
    benchmark: >-
      OMP_NUM_THREADS=12 OMP_PROC_BIND=close OMP_PLACES=cores
      numactl --physcpubind=96-191 --membind=1 env PYTHONPATH=src
      .venv/bin/python tests/bench_sparse_mla_tail_variants.py
      --threads 12 --warmup 5 --iters 21
    result: optimizations/sparse_mla/results/amazon_192c_masked_tail_20260812.md

  - id: packing.masked_dense_kv
    part: packing
    status: candidate
    owner: zhangxu
    opened: 2026-08-12
    decision_by: 2026-09-11
    implementation: csrc/sparse_mla.cpp
    hypothesis: >-
      Packing each promoted K/V tile once per eight-query plan and reusing the
      current head's packed Q across dense and masked segments amortizes layout
      conversion across 32 query heads.
    depends_on:
      - planning.masked_dense_tail
    conflicts_with: []
    next_decision: >-
      Measure allocator and pack traffic separately if the masked variants are
      retained after the target-host decision.
    adoption_gate: >-
      Meet the planning.masked_dense_tail latency gate with packing included in
      the timed forward call.
    correctness: >-
      PYTHONPATH=src OMP_NUM_THREADS=12 .venv/bin/python -m pytest -q
      tests/test_sparse_mla.py
    benchmark: >-
      OMP_NUM_THREADS=12 OMP_PROC_BIND=close OMP_PLACES=cores
      numactl --physcpubind=96-191 --membind=1 env PYTHONPATH=src
      .venv/bin/python tests/bench_sparse_mla_tail_variants.py
      --threads 12 --warmup 5 --iters 21
    result: optimizations/sparse_mla/results/amazon_192c_masked_tail_20260812.md

  - id: compute.bfmmla_2x2_pruning
    part: compute
    status: candidate
    owner: zhangxu
    opened: 2026-08-12
    decision_by: 2026-09-11
    implementation:
      - csrc/sparse_mla_tail_microkernels.cpp
      - csrc/sparse_mla_tail_microkernels.h
    hypothesis: >-
      Compile-time pruning of inactive BFMMLA 2x2 blocks reduces a causal 8x8
      QK tile from 16 to 10 BFMMLA updates per E/4 step and outperforms the
      full masked-dense tile.
    depends_on:
      - planning.masked_dense_tail
      - packing.masked_dense_kv
    conflicts_with: []
    next_decision: >-
      The tail-only gate passed by 4.7% to 12.9%, but the 2048 full forward did
      not improve at 12 or more threads. Retain only if a production workload
      justifies a tail-heavy or single-thread dispatch; otherwise remove the
      specialized dispatch by the decision deadline.
    adoption_gate: >-
      At least 1% lower median latency than masked_dense_8x8 and no regression
      against indexed_4x4 at the selected production thread count.
    correctness: >-
      PYTHONPATH=src OMP_NUM_THREADS=12 .venv/bin/python -m pytest -q
      tests/test_sparse_mla.py -k tail_variants
    benchmark: >-
      OMP_NUM_THREADS=12 OMP_PROC_BIND=close OMP_PLACES=cores
      numactl --physcpubind=96-191 --membind=1 env PYTHONPATH=src
      .venv/bin/python tests/bench_sparse_mla_tail_variants.py
      --threads 12 --warmup 5 --iters 21
    result: optimizations/sparse_mla/results/amazon_192c_masked_tail_20260812.md

  - id: compute.bfmlal_lane_pruning
    part: compute
    status: candidate
    owner: zhangxu
    opened: 2026-08-12
    decision_by: 2026-09-11
    implementation:
      - csrc/sparse_mla_tail_microkernels.cpp
      - csrc/sparse_mla_tail_microkernels.h
    hypothesis: >-
      Skipping invalid masked P coefficients reduces a causal 8x8 PV tile from
      64 to 36 coefficient updates and lets the pruned variant outperform the
      full masked-dense PV kernel.
    depends_on:
      - compute.bfmmla_2x2_pruning
    conflicts_with: []
    next_decision: >-
      Evaluate only together with compute.bfmmla_2x2_pruning because there is no
      PV-only variant. The combined path passes the tail-only isolation gate but
      still requires an end-to-end dispatch case before adoption.
    adoption_gate: >-
      The combined pruned variant must satisfy the BFMMLA pruning adoption gate
      and remain within the sparse MLA numerical tolerance.
    correctness: >-
      PYTHONPATH=src OMP_NUM_THREADS=12 .venv/bin/python -m pytest -q
      tests/test_sparse_mla.py -k tail_variants
    benchmark: >-
      OMP_NUM_THREADS=12 OMP_PROC_BIND=close OMP_PLACES=cores
      numactl --physcpubind=96-191 --membind=1 env PYTHONPATH=src
      .venv/bin/python tests/bench_sparse_mla_tail_variants.py
      --threads 12 --warmup 5 --iters 21
    result: optimizations/sparse_mla/results/amazon_192c_masked_tail_20260812.md

  - id: compute.fused_online_epilogue
    part: compute
    status: experimental
    owner: zhangxu
    opened: 2026-08-12
    decision_by: 2026-09-11
    implementation:
      - csrc/sparse_mla.cpp
      - csrc/sparse_mla_tail_microkernels.cpp
      - csrc/sparse_mla_tail_microkernels.h
    hypothesis: >-
      Keeping one 8x8 score tile and its rounded BF16 probabilities in SVE
      registers removes score and p_hat scratch traffic while preserving the
      existing online-softmax state update.
    depends_on:
      - compute.bfmmla_2x2_pruning
    conflicts_with: []
    next_decision: >-
      Keep as an experimental comparison only. FMLA wins at SVL256 but the
      materialized pruned path wins at SVL128, so there is no single default
      epilogue across the validated machines.
    adoption_gate: >-
      Beat masked_dense_8x8_pruned by at least 3% on both SVL128 and SVL256
      without losing mask coverage or return_stats support.
    correctness: >-
      PYTHONPATH=src OMP_NUM_THREADS=4 .venv/bin/python -m pytest -q
      tests/test_sparse_mla.py
    benchmark: >-
      OMP_NUM_THREADS=1 OMP_DYNAMIC=FALSE OMP_PROC_BIND=close
      tests/bench_sparse_mla_tail_variants.py --workload tail-causal
      --tail-blocks 1024 --variants indexed_4x4 masked_dense_8x8_pruned
      masked_dense_8x8_fused_fmla masked_dense_8x8_fused_bfmlal
      masked_dense_8x8_fused_bfmmla --warmup 5 --iters 21
    result: optimizations/sparse_mla/results/amazon_sparse_mla_2d_fused_20260812.md

  - id: scheduling.kv_2d_split
    part: scheduling
    status: enabled
    owner: zhangxu
    opened: 2026-08-12
    decision_by: 2026-09-11
    implementation: csrc/sparse_mla.cpp
    hypothesis: >-
      When eight-query block count leaves at least half of the requested worker
      pool idle, split heavy blocks across disjoint KV shards and merge their
      local online-softmax states associatively.
    depends_on: []
    conflicts_with: []
    next_decision: >-
      Profile task construction, packing duplication, and partial-state merge;
      consider a calibrated shard count after collecting production chunk-size
      distributions.
    adoption_gate: >-
      At least 2x lower 64-token latency on 96 cores, within 0.5% at 4096 and
      8192 tokens, and tolerance-equivalent output with stats and attention sink.
    correctness: >-
      PYTHONPATH=src OMP_NUM_THREADS=4 .venv/bin/python -m pytest -q
      tests/test_sparse_mla.py
    benchmark: >-
      OMP_NUM_THREADS=96 OMP_DYNAMIC=FALSE OMP_PROC_BIND=close OMP_PLACES=cores
      numactl --physcpubind=96-191 --membind=1 env PYTHONPATH=src
      .venv/bin/python tests/bench_sparse_mla_tail_variants.py
      --workload dsv4-sparse --s-q 64 --context-start 4032
      --variants indexed_4x4 indexed_4x4_2d --warmup 5 --iters 21
    result: optimizations/sparse_mla/results/amazon_sparse_mla_2d_fused_20260812.md

variants:
  - id: indexed_4x4
    entrypoint: _flash_mla_sparse_fwd_variant(..., "indexed_4x4")
    status: reference
    features: []

  - id: indexed_4x4_2d
    entrypoint: _flash_mla_sparse_fwd_variant(..., "indexed_4x4_2d")
    status: enabled
    features:
      - scheduling.kv_2d_split

  - id: heads_dense_8x8
    entrypoint: _flash_mla_sparse_fwd_variant(..., "heads_dense_8x8")
    status: experimental
    features:
      - scheduling.head_major_dense

  - id: masked_dense_8x8
    entrypoint: _flash_mla_sparse_fwd_variant(..., "masked_dense_8x8")
    status: candidate
    features:
      - planning.masked_dense_tail
      - packing.masked_dense_kv

  - id: masked_dense_8x8_pruned
    entrypoint: _flash_mla_sparse_fwd_variant(..., "masked_dense_8x8_pruned")
    status: candidate
    features:
      - planning.masked_dense_tail
      - packing.masked_dense_kv
      - compute.bfmmla_2x2_pruning
      - compute.bfmlal_lane_pruning

  - id: masked_dense_8x8_pruned_2d
    entrypoint: _flash_mla_sparse_fwd_variant(..., "masked_dense_8x8_pruned_2d")
    status: experimental
    features:
      - planning.masked_dense_tail
      - packing.masked_dense_kv
      - compute.bfmmla_2x2_pruning
      - compute.bfmlal_lane_pruning
      - scheduling.kv_2d_split

  - id: masked_dense_8x8_fused_fmla
    entrypoint: _flash_mla_sparse_fwd_variant(..., "masked_dense_8x8_fused_fmla")
    status: experimental
    features:
      - planning.masked_dense_tail
      - packing.masked_dense_kv
      - compute.bfmmla_2x2_pruning
      - compute.fused_online_epilogue

  - id: masked_dense_8x8_fused_bfmlal
    entrypoint: _flash_mla_sparse_fwd_variant(..., "masked_dense_8x8_fused_bfmlal")
    status: experimental
    features:
      - planning.masked_dense_tail
      - packing.masked_dense_kv
      - compute.bfmmla_2x2_pruning
      - compute.fused_online_epilogue

  - id: masked_dense_8x8_fused_bfmmla
    entrypoint: _flash_mla_sparse_fwd_variant(..., "masked_dense_8x8_fused_bfmmla")
    status: experimental
    features:
      - planning.masked_dense_tail
      - packing.masked_dense_kv
      - compute.bfmmla_2x2_pruning
      - compute.fused_online_epilogue
