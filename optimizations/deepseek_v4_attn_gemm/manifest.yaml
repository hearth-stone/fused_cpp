operator: deepseek_v4_attn_gemm

baseline:
  id: legacy_row_split
  implementation: csrc/deepseek_v4_attn_gemm_fused.cpp
  entrypoint: deepseek_v4_attn_gemm_fused_prepacked
  status: reference

features:
  - id: schedule.m8_aligned
    part: schedule
    status: enabled
    implementation: csrc/deepseek_v4_attn_gemm_fused.cpp
    hypothesis: >-
      Partitioning M in complete M8 panels removes per-thread tail
      overcomputation while preserving the existing GEMM kernels, packed
      weights, output layouts, and one OpenMP region.
    depends_on: []
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_deepseek_v4_attn_gemm_fused.py
    benchmark: >-
      PYTHONPATH=src FUSED_CPP_ATTN_GEMM_BACKEND=neon
      numactl --physcpubind=0-95 --membind=0 .venv/bin/python
      tests/bench_deepseek_v4_attn_gemm_fused.py
      --cores 0-95 --warmup 3 --runs 15 --schedule m8

  - id: runtime.shared_task_pool
    part: runtime
    status: enabled
    implementation: csrc/deepseek_v4_attn_gemm_fused.cpp
    hypothesis: >-
      Publishing all M8 panels from the four attention GEMMs to one worker
      pool removes stage barriers and lets workers immediately take work from
      the next GEMM when a narrow GEMM no longer has enough parallel panels.
    depends_on:
      - schedule.m8_aligned
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_deepseek_v4_attn_gemm_fused.py
    benchmark: >-
      PYTHONPATH=src FUSED_CPP_ATTN_GEMM_BACKEND=neon
      numactl --physcpubind=0-95 --membind=0 .venv/bin/python
      tests/bench_deepseek_v4_attn_gemm_fused.py
      --cores 0-95 --warmup 3 --runs 15 --schedule pool

  - id: schedule.mn_groups
    part: schedule
    status: enabled
    implementation: csrc/deepseek_v4_attn_gemm_fused.cpp
    hypothesis: >-
      Splitting each packed-B N range into tile-aligned groups exposes enough
      parallelism for one large GEMM to use the NUMA worker set. Owner-first
      M8-panel queues retain locality while allowing work stealing across all
      four GEMMs.
    depends_on:
      - runtime.shared_task_pool
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_deepseek_v4_attn_gemm_fused.py
    benchmark: >-
      PYTHONPATH=src FUSED_CPP_ATTN_GEMM_BACKEND=neon
      numactl --physcpubind=0-95 --membind=0 .venv/bin/python
      tests/bench_deepseek_v4_attn_gemm_fused.py
      --cores 0-95 --warmup 3 --runs 15 --schedule mn

  - id: compute.shared_prepacked_a
    part: compute
    status: enabled
    implementation:
      - csrc/deepseek_v4_attn_gemm_fused.cpp
      - csrc/deepseek_v4_attn_gemm_sve.cpp
      - csrc/moe/arm/neon_bf16/kernels.S
    hypothesis: >-
      Cooperatively packing each M8 or M12 panel of A once before the MN task pool
      removes repeated row-major-to-packed conversion across the four GEMMs
      and their N groups. One barrier publishes the packed buffer before the
      workers consume it.
    depends_on:
      - schedule.mn_groups
    conflicts_with: []
    selection: >-
      Linux SVE MN execution always uses shared exact-M prepack. Linux NEON MN
      execution enables shared prepack by default when the
      requested N-group budget is at least 24. FUSED_CPP_ATTN_GEMM_PREPACK_A
      can force the NEON path on or off.
    correctness: >-
      PYTHONPATH=src FUSED_CPP_ATTN_GEMM_BACKEND=neon
      .venv/bin/python -m pytest -q
      tests/test_deepseek_v4_attn_gemm_fused.py
    benchmark: >-
      PYTHONPATH=src FUSED_CPP_ATTN_GEMM_BACKEND=neon
      numactl --physcpubind=0-95 --membind=0 .venv/bin/python
      tests/bench_deepseek_v4_attn_gemm_fused.py
      --cores 0-95 --warmup 3 --runs 15 --schedule mn
      --prepack-a auto

  - id: compute.sve_jit_m12_windows
    part: compute
    status: enabled
    owner: zhangxu
    opened: 2026-08-20
    decision_by: 2026-09-19
    implementation:
      - csrc/deepseek_v4_attn_gemm_sve.cpp
      - csrc/deepseek_v4_attn_gemm_fused.cpp
      - csrc/moe/arm/sve_bf16/jit_kernels.cpp
    hypothesis: >-
      Reusing the MoE exact-M SVE JIT makes M12 the main attention GEMM panel,
      removes the independent M8 intrinsic kernel, and lets the existing
      contiguous N groups act as packed-B windows without changing the packed
      weight format. M1-M11 JIT tails avoid padded row computation.
    depends_on:
      - schedule.mn_groups
      - runtime.shared_task_pool
    conflicts_with: []
    selection: >-
      Auto/default selection uses SVE when the build has SVE BF16 and
      xbyak_aarch64, with NEON as the unsupported-machine fallback.
      FUSED_CPP_ATTN_GEMM_BACKEND can force sve or neon and
      FUSED_CPP_ATTN_GEMM_SVE=0 disables automatic SVE selection.
      FUSED_CPP_ATTN_GEMM_N_GROUPS continues to control the number of contiguous
      N windows; it is not expanded into a new search variable.
    correctness: >-
      PYTHONPATH=src OMP_NUM_THREADS=8 OMP_DYNAMIC=FALSE taskset -c 0-7
      .venv/bin/python -m pytest -q
      tests/test_deepseek_v4_attn_gemm_fused.py
      -k sve_m12_windows
    benchmark: >-
      PYTHONPATH=src FUSED_CPP_ATTN_GEMM_BACKEND=sve
      OMP_NUM_THREADS=8 OMP_DYNAMIC=FALSE taskset -c 0-7
      .venv/bin/python tests/bench_deepseek_v4_attn_gemm_fused.py
      --cores 0-7 --warmup 5 --runs 31 --schedule mn
    result: >-
      optimizations/deepseek_v4_attn_gemm/results/arm_codex_internal_sve_m12_windows_20260820.md
    next_decision: >-
      Compare SVE M12 JIT against the retained NEON MN path on the 8-core and
      96-core Arm machines, including M12 boundaries and production prefill M.
    adoption_gate: >-
      All BF16/FP32 outputs pass exact-M and N-window correctness, no tested
      production shape regresses by more than 2%, and geometric-mean GEMM-stage
      latency improves by at least 3% on both Arm machines.

variants:
  - id: attn_gemm_m8
    features:
      - schedule.m8_aligned
  - id: attn_gemm_pool
    features:
      - schedule.m8_aligned
      - runtime.shared_task_pool
  - id: attn_gemm_mn
    features:
      - schedule.m8_aligned
      - runtime.shared_task_pool
      - schedule.mn_groups
      - compute.shared_prepacked_a
  - id: attn_gemm_sve_jit_m12_windows
    status: enabled
    features:
      - schedule.m8_aligned
      - runtime.shared_task_pool
      - schedule.mn_groups
      - compute.shared_prepacked_a
      - compute.sve_jit_m12_windows
