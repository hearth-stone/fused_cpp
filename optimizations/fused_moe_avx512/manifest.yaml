operator: fused_moe_avx512

baseline:
  id: pytorch_onednn_staged_avx512
  implementation: src/fused_cpp/moe/naive.py
  entrypoint: fused_moe_naive
  status: reference

features:
  - id: layout.amx_k32_row_major_a
    part: layout
    status: experimental
    implementation: >-
      csrc/moe/x86/avx512_bf16/backend.cpp and
      csrc/moe/x86/avx512_bf16/executor.cpp
    hypothesis: >-
      Reusing the VNNI2 K-pair/N32 packed-weight format while padding K to 32
      lets AMX load B directly, and gathering A plus the W13 intermediate in
      row-major M16 panels removes the AVX-512 packed-A transpose.
    depends_on:
      - layout.vnni2_packed_weights
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_moe_avx512_bf16.py
    benchmark: >-
      OMP_NUM_THREADS=1 taskset -c 0 benchmarks/bench_amx_bf16_gemm
      16 512 4096 10 51

  - id: layout.vnni2_packed_weights
    part: layout
    status: experimental
    implementation: csrc/moe/x86/avx512_bf16/backend.cpp
    hypothesis: >-
      Packing adjacent BF16 K pairs in VNNI2 order once at model load time lets
      every runtime inner product use VDPBF16PS without oneDNN reorder or
      transpose work inside the expert invocation.
    depends_on: []
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_moe_avx512_bf16.py
    benchmark: >-
      ONEDNN_MAX_CPU_ISA=AVX512_CORE_BF16 OMP_NUM_THREADS=1
      taskset -c 0 env PYTHONPATH=src .venv/bin/python
      tests/bench_moe_avx512_bf16.py --tokens 12 --hidden 4096
      --intermediate 512 --experts 1 --top-k 1 --routing hot --threads 1

  - id: compute.m12n32_vdpbf16ps
    part: compute
    status: experimental
    implementation: csrc/moe/x86/avx512_bf16/kernels.cpp
    hypothesis: >-
      Twelve independent M rows and two 16-column halves provide enough
      accumulator independence to hide VDPBF16PS latency for decode-sized
      experts while retaining a 32-column packed-B tile.
    depends_on:
      - layout.vnni2_packed_weights
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_moe_avx512_bf16.py
    benchmark: >-
      ONEDNN_MAX_CPU_ISA=AVX512_CORE_BF16 OMP_NUM_THREADS=1
      taskset -c 0 env PYTHONPATH=src .venv/bin/python
      tests/bench_moe_avx512_bf16.py --tokens 12 --hidden 4096
      --intermediate 512 --experts 1 --top-k 1 --routing hot --threads 1

  - id: compute.onednn_bf16_expert_matmuls
    part: compute
    status: experimental
    implementation: benchmarks/bench_onednn_bf16_expert.cpp
    hypothesis: >-
      Public oneDNN BF16 matmul primitives with any-format weights and
      one-time reorders provide a low-overhead single-expert compute control
      for gate, up, and down projections on both AMX and AVX-512 BF16.
    depends_on: []
    conflicts_with: []
    correctness: >-
      OMP_NUM_THREADS=1 taskset -c 0
      benchmarks/bench_onednn_bf16_expert 17 131 83 2 7
    benchmark: >-
      OMP_NUM_THREADS=2 OMP_DYNAMIC=FALSE OMP_PROC_BIND=close
      OMP_WAIT_POLICY=PASSIVE taskset -c 0,1
      benchmarks/bench_onednn_bf16_expert 256 4096 512 5 21

  - id: compute.xbyak_amx_1m4n
    part: compute
    status: experimental
    implementation: csrc/moe/x86/avx512_bf16/jit_kernels.cpp
    hypothesis: >-
      Keeping four accumulator tiles and reusing one A tile across two
      adjacent N32 blocks reduces A tile loads while retaining K double
      buffering for both W13 and W2. Odd N32 and W13 feature blocks fall back
      to the established 1M-by-2N schedule.
    depends_on:
      - compute.xbyak_amx_m16n32
    conflicts_with: []
    correctness: >-
      FUSED_CPP_MOE_AMX_PATTERN=m1n4 PYTHONPATH=src
      .venv/bin/python -m pytest -q tests/test_moe_avx512_bf16.py
    benchmark: >-
      OMP_NUM_THREADS=2 OMP_DYNAMIC=FALSE OMP_WAIT_POLICY=PASSIVE
      taskset -c 0,1 env PYTHONPATH=src .venv/bin/python
      benchmarks/bench_amx_bf16_patterns.py --tokens 2048 --hidden 4096
      --intermediate 512 --experts 8 --top-k 1 --routing hot --threads 2

  - id: compute.xbyak_amx_2m2n
    part: compute
    status: experimental
    implementation: csrc/moe/x86/avx512_bf16/jit_kernels.cpp
    hypothesis: >-
      Keeping two M panels and two N tiles reuses each packed B tile across
      both panels, eliminating the M16-plus-tail B reload and reducing B-side
      cache traffic for exact M17-32 and composed larger-M experts.
    depends_on:
      - compute.xbyak_amx_m16n32
    conflicts_with: []
    correctness: >-
      FUSED_CPP_MOE_AMX_PATTERN=m2n2 PYTHONPATH=src
      .venv/bin/python -m pytest -q tests/test_moe_avx512_bf16.py
    benchmark: >-
      OMP_NUM_THREADS=2 OMP_DYNAMIC=FALSE OMP_WAIT_POLICY=PASSIVE
      taskset -c 0,1 env PYTHONPATH=src .venv/bin/python
      benchmarks/bench_amx_bf16_patterns.py --tokens 2048 --hidden 4096
      --intermediate 512 --experts 8 --top-k 1 --routing hot --threads 2

  - id: compute.xbyak_amx_m16n32
    part: compute
    status: experimental
    implementation: csrc/moe/x86/avx512_bf16/jit_kernels.cpp
    hypothesis: >-
      Exact-M1..16 AMX BF16 kernels with dynamic K32 loops, M16 panel
      composition, and N32 output blocks raise fused-expert GEMM throughput
      materially above AVX-512 while retaining arbitrary-M correctness.
    depends_on:
      - layout.amx_k32_row_major_a
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_moe_avx512_bf16.py
    benchmark: >-
      OMP_NUM_THREADS=1 taskset -c 0 benchmarks/bench_amx_bf16_gemm
      16 512 4096 10 51

  - id: compute.xbyak_exact_m
    part: compute
    status: experimental
    implementation: >-
      csrc/moe/x86/avx512_bf16/jit_kernels.cpp and setup.py
    hypothesis: >-
      Generating register-resident W13 and W2 kernels for exact logical M=1..12
      removes the physical-M16 tail penalty, while a dynamic K loop and cached
      M12 specialization keep exact-panel throughput within 3% of the intrinsic
      implementation. Splitting K accumulation for small M supplies enough
      independent VDPBF16PS chains to reach at least 85% of prepacked oneDNN
      AVX-512 BF16 at M=4, M=8, and M=11.
    depends_on:
      - layout.vnni2_packed_weights
      - compute.m12n32_vdpbf16ps
    conflicts_with: []
    correctness: >-
      FUSED_CPP_MOE_AVX512_IMPL=jit PYTHONPATH=src
      .venv/bin/python -m pytest -q tests/test_moe_avx512_bf16.py
    benchmark: >-
      ONEDNN_MAX_CPU_ISA=AVX512_CORE_BF16
      FUSED_CPP_MOE_AVX512_IMPL=jit OMP_NUM_THREADS=1
      taskset -c 0 benchmarks/bench_avx512_bf16_gemm 4 512 4096 10 51

  - id: schedule.n_window_cache_blocking
    part: schedule
    status: enabled
    implementation: csrc/moe/x86/avx512_bf16/jit_kernels.cpp
    hypothesis: >-
      Deriving an AMX block count from approximately 1 MiB of packed W13 or
      512 KiB of packed W2, then traversing M panels inside that N window,
      keeps a dimension-aware packed-B working set in private L2 and reduces
      shared-L3 traffic for large-M experts. Explicit zero and positive values
      remain reproducibility and tuning overrides; AVX-512 remains unblocked
      by default.
    depends_on:
      - layout.vnni2_packed_weights
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_moe_avx512_bf16.py -k cache_block
    benchmark: >-
      OMP_NUM_THREADS=2 OMP_DYNAMIC=FALSE OMP_WAIT_POLICY=PASSIVE
      taskset -c 0,1 env PYTHONPATH=src .venv/bin/python
      benchmarks/bench_x86_bf16_cache_blocks.py --backend x86_amx_bf16
      --amx-pattern m1n4 --configs auto:auto,0:0,2:0,4:0,6:0,0:8,0:16,4:16
      --tokens 2048 --hidden 4096 --intermediate 512 --experts 1
      --top-k 1 --routing hot --threads 2

  - id: schedule.amx_macro_m_tile_state
    part: schedule
    status: experimental
    implementation: csrc/moe/x86/avx512_bf16/jit_kernels.cpp
    hypothesis: >-
      Moving adjacent full M16 or M32 units into one generated W13/W2 call
      amortizes LDTILECFG, TILERELEASE, the callee-save frame, resident SiLU
      constants, and W2 masks without changing the cache-window loop order.
      Exact M tails remain isolated per-call specializations.
    depends_on:
      - compute.xbyak_amx_m16n32
      - compute.xbyak_amx_1m4n
      - compute.xbyak_amx_2m2n
      - schedule.n_window_cache_blocking
    conflicts_with: []
    correctness: >-
      FUSED_CPP_MOE_AMX_TILE_STATE=macro_m PYTHONPATH=src
      .venv/bin/python -m pytest -q tests/test_moe_avx512_bf16.py
      -k macro_m_tile_state
    benchmark: >-
      OMP_NUM_THREADS=8 OMP_DYNAMIC=FALSE OMP_PROC_BIND=close
      OMP_PLACES=cores taskset -c 0-7
      env PYTHONPATH=src .venv/bin/python
      benchmarks/bench_amx_bf16_patterns.py --patterns auto
      --silu-epilogues auto --w2-epilogues auto
      --tile-states per_call,macro_m --tokens 2048 --hidden 4096
      --intermediate 512 --experts 1 --top-k 1 --routing hot
      --threads 8 --warmup 8 --runs 31

  - id: dispatch.amx_backend_pattern_cache_auto
    part: dispatch
    status: enabled
    implementation: >-
      csrc/moe/common/backend.cpp and
      csrc/moe/x86/avx512_bf16/jit_kernels.cpp
    hypothesis: >-
      Preferring AMX when runtime support is available, selecting m2n2 below
      M=76 and m1n4 at or above M=76 independently for each routed expert,
      and deriving cache windows from K-padded bytes removes required
      environment tuning while preserving explicit overrides and AVX-512
      fallback.
    depends_on:
      - compute.xbyak_amx_1m4n
      - compute.xbyak_amx_2m2n
      - schedule.n_window_cache_blocking
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_moe_backend_dispatch.py tests/test_moe_avx512_bf16.py
      -k 'auto or mixed_expert_sizes or kill_switch'
    benchmark: >-
      OMP_NUM_THREADS=2 OMP_DYNAMIC=FALSE OMP_WAIT_POLICY=PASSIVE
      taskset -c 0,1 env PYTHONPATH=src .venv/bin/python
      benchmarks/bench_amx_bf16_patterns.py --tokens 2048 --hidden 4096
      --intermediate 512 --experts 1 --top-k 1 --routing hot --threads 2

  - id: epilogue.amx_tilestore_silu
    part: intermediate
    status: experimental
    implementation: csrc/moe/x86/avx512_bf16/jit_kernels.cpp
    hypothesis: >-
      Storing W13 AMX accumulators into a 2 KiB per-call L1 scratch and running
      polynomial SiLU-times-up in ZMM registers preserves fusion while writing
      the row-major BF16 intermediate consumed directly by AMX W2.
    depends_on:
      - compute.xbyak_amx_m16n32
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_moe_avx512_bf16.py
    benchmark: >-
      OMP_NUM_THREADS=1 taskset -c 0 benchmarks/bench_amx_bf16_w13
      16 4096 512 10 51 5

  - id: epilogue.amx_resident_silu_constants
    part: intermediate
    status: enabled
    implementation: csrc/moe/x86/avx512_bf16/jit_kernels.cpp
    hypothesis: >-
      Broadcasting polynomial, clamp, log, and exponent constants once in the
      AMX W13 prologue removes repeated constant-memory uops from every output
      row and reduces generated code without changing arithmetic order.
    depends_on:
      - epilogue.amx_tilestore_silu
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_moe_avx512_bf16.py -k silu_epilogue
    benchmark: >-
      OMP_NUM_THREADS=1 taskset -c 0 benchmarks/bench_amx_bf16_w13
      16 4096 512 20 101 5 baseline,resident

  - id: epilogue.amx_two_row_silu_pipeline
    part: intermediate
    status: experimental
    implementation: csrc/moe/x86/avx512_bf16/jit_kernels.cpp
    hypothesis: >-
      Interleaving the same SiLU arithmetic stages for two independent output
      rows may cover vector dependency latency beyond constant residency.
      C8i full-expert measurements did not show a stable advantage, so this
      remains a validation override rather than the automatic path.
    depends_on:
      - epilogue.amx_resident_silu_constants
    conflicts_with: []
    correctness: >-
      FUSED_CPP_MOE_AMX_SILU_EPILOGUE=pipelined PYTHONPATH=src
      .venv/bin/python -m pytest -q tests/test_moe_avx512_bf16.py
      -k silu_epilogue
    benchmark: >-
      OMP_NUM_THREADS=1 taskset -c 0 benchmarks/bench_amx_bf16_w13
      16 4096 512 20 101 5 baseline,resident,pipelined

  - id: epilogue.amx_rcp14_silu
    part: intermediate
    status: experimental
    implementation: csrc/moe/x86/avx512_bf16/jit_kernels.cpp
    hypothesis: >-
      Replacing VDIVPS with VRCP14PS shortens the final SiLU dependency chain,
      but changes BF16 values and showed no full-expert gain beyond measurement
      noise; it must remain opt-in.
    depends_on:
      - epilogue.amx_two_row_silu_pipeline
    conflicts_with: []
    correctness: >-
      FUSED_CPP_MOE_AMX_SILU_EPILOGUE=rcp14 PYTHONPATH=src
      .venv/bin/python -m pytest -q tests/test_moe_avx512_bf16.py
      -k silu_epilogue
    benchmark: >-
      OMP_NUM_THREADS=1 taskset -c 0 benchmarks/bench_amx_bf16_w13
      16 4096 512 20 101 5 baseline,resident,pipelined,rcp14

  - id: epilogue.onednn_primitive_silu_mul
    part: intermediate
    status: experimental
    implementation: benchmarks/bench_onednn_bf16_expert.cpp
    hypothesis: >-
      Standalone oneDNN BF16 swish and binary-multiply primitives form a
      portable basic-expert baseline with no custom activation code.
    depends_on:
      - compute.onednn_bf16_expert_matmuls
    conflicts_with:
      - epilogue.onednn_swish_binary_postops
    correctness: >-
      OMP_NUM_THREADS=1 taskset -c 0
      benchmarks/bench_onednn_bf16_expert 17 131 83 2 7
    benchmark: >-
      OMP_NUM_THREADS=2 OMP_DYNAMIC=FALSE OMP_PROC_BIND=close
      OMP_WAIT_POLICY=PASSIVE taskset -c 0,1
      benchmarks/bench_onednn_bf16_expert 256 4096 512 5 21

  - id: epilogue.onednn_swish_binary_postops
    part: intermediate
    status: experimental
    implementation: benchmarks/bench_onednn_bf16_expert.cpp
    hypothesis: >-
      Appending swish and binary multiply to the gate matmul removes two
      primitive launches and the materialized gate and activated tensors,
      improving small-expert latency without changing the BF16 interface.
    depends_on:
      - compute.onednn_bf16_expert_matmuls
    conflicts_with:
      - epilogue.onednn_primitive_silu_mul
    correctness: >-
      OMP_NUM_THREADS=1 taskset -c 0
      benchmarks/bench_onednn_bf16_expert 17 131 83 2 7
    benchmark: >-
      OMP_NUM_THREADS=2 OMP_DYNAMIC=FALSE OMP_PROC_BIND=close
      OMP_WAIT_POLICY=PASSIVE taskset -c 0,1
      benchmarks/bench_onednn_bf16_expert 256 4096 512 5 21

  - id: epilogue.silu_mul_packa
    part: intermediate
    status: experimental
    implementation: csrc/moe/x86/avx512_bf16/kernels.cpp
    hypothesis: >-
      Applying polynomial SiLU, multiplying the up projection, converting to
      BF16, and writing W2's VNNI2 packed-A layout in the W13 epilogue avoids
      materializing two FP32 projections and a separate pack operation.
    depends_on:
      - compute.m12n32_vdpbf16ps
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_moe_avx512_bf16.py
    benchmark: >-
      ONEDNN_MAX_CPU_ISA=AVX512_CORE_BF16 OMP_NUM_THREADS=1
      taskset -c 0 env PYTHONPATH=src .venv/bin/python
      tests/bench_moe_avx512_bf16.py --tokens 12 --hidden 4096
      --intermediate 512 --experts 1 --top-k 1 --routing hot --threads 1

  - id: store.amx_m1n4_combined
    part: store
    status: experimental
    implementation: csrc/moe/x86/avx512_bf16/jit_kernels.cpp
    hypothesis: >-
      Storing all four M1N4 accumulators into a 4 KiB scratch before the row
      loop computes each flat-route destination once for N64. It improved the
      isolated M256 W2 kernel but regressed large-M end-to-end cases, so it is
      retained as an explicit validation mode rather than automatic.
    depends_on:
      - compute.xbyak_amx_1m4n
    conflicts_with:
      - store.amx_expert_contiguous_tilestore
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_moe_avx512_bf16.py -k w2_store_merge_epilogues
    benchmark: >-
      OMP_NUM_THREADS=1 taskset -c 0
      benchmarks/bench_amx_bf16_w2_epilogues
      256 512 4096 15 81 baseline,combined,tile_store

  - id: store.amx_expert_contiguous_tilestore
    part: store
    status: experimental
    implementation: >-
      csrc/moe/x86/avx512_bf16/jit_kernels.cpp and
      csrc/moe/x86/avx512_bf16/executor.cpp
    hypothesis: >-
      Assigning each expert a contiguous FP32 route-row range lets W2 write TMM
      accumulators directly with TILESTORED, removing the stack round trip and
      row-wise ZMM stores. K=512 W2 improved, but K=32 exposed poor wide-stride
      tile-store bandwidth and end-to-end behavior remained shape-dependent,
      so baseline stays automatic.
    depends_on:
      - compute.xbyak_amx_m16n32
    conflicts_with:
      - store.amx_m1n4_combined
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_moe_avx512_bf16.py -k 'w2_store_merge_epilogues or w2_tile_store_keeps'
    benchmark: >-
      OMP_NUM_THREADS=1 taskset -c 0
      benchmarks/bench_amx_bf16_w2_epilogues
      16 512 4096 20 101 baseline,combined,tile_store

  - id: merge.avx512_mapped_expert_rows
    part: merge
    status: experimental
    implementation: >-
      csrc/moe/x86/avx512_bf16/kernels.cpp and
      csrc/moe/x86/avx512_bf16/executor.cpp
    hypothesis: >-
      A one-time flat-route-to-expert-row map preserves token/top-k reduction
      order while allowing expert-contiguous W2 stores. The extra row lookup
      is negligible at medium/large workspaces but measurable for small routes.
    depends_on:
      - store.amx_expert_contiguous_tilestore
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_moe_avx512_bf16.py -k w2_store_merge_epilogues
    benchmark: >-
      OMP_NUM_THREADS=1 taskset -c 0
      benchmarks/bench_amx_bf16_merge 256 4096 8 2 20 101

  - id: store.direct_route
    part: store
    status: experimental
    implementation: >-
      csrc/moe/x86/avx512_bf16/kernels.cpp and
      csrc/moe/x86/avx512_bf16/jit_kernels.cpp and
      csrc/moe/x86/avx512_bf16/executor.cpp
    hypothesis: >-
      Writing W2 accumulators directly to their flat route rows removes a
      contiguous expert output and the following scatter pass. Top-1
      skip-weighted calls can convert and store BF16 directly to user output.
    depends_on: []
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_moe_avx512_bf16.py
    benchmark: >-
      ONEDNN_MAX_CPU_ISA=AVX512_CORE_BF16 OMP_NUM_THREADS=1
      taskset -c 0 env PYTHONPATH=src .venv/bin/python
      tests/bench_moe_avx512_bf16.py --tokens 16 --hidden 4096
      --intermediate 512 --experts 8 --top-k 6 --routing balanced --threads 1

  - id: merge.avx512_weighted_reduce
    part: merge
    status: experimental
    implementation: csrc/moe/x86/avx512_bf16/kernels.cpp
    hypothesis: >-
      Keeping one 16-column weighted sum in ZMM registers across all top-k
      routes avoids a temporary FP32 accumulation row and converts only the
      final value to BF16.
    depends_on:
      - store.direct_route
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_moe_avx512_bf16.py
    benchmark: >-
      ONEDNN_MAX_CPU_ISA=AVX512_CORE_BF16 OMP_NUM_THREADS=2
      OMP_WAIT_POLICY=PASSIVE
      taskset -c 0,1 env PYTHONPATH=src .venv/bin/python
      tests/bench_moe_avx512_bf16.py --tokens 16 --hidden 4096
      --intermediate 512 --experts 8 --top-k 6 --routing balanced --threads 2

  - id: dispatch.expert_team_nsplit_waves
    part: dispatch
    status: enabled
    implementation: csrc/moe/x86/avx512_bf16/executor.cpp
    hypothesis: >-
      A global expert queue is cheapest when balanced routes expose at least
      one expert per worker. When active experts underfill the machine,
      route-weighted teams can share gathered A and split disjoint W13 F16 and
      W2 N32 ranges. For a route at least 64 rows and twice the next largest,
      sorted waves give the hot expert a wider team and reduce the serial tail.
      Cancellable phase barriers preserve dependency order and release peers
      if one generated kernel fails.
    depends_on:
      - store.direct_route
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_moe_avx512_bf16.py -k
      'expert_or_nsplit or cache_block or hot_multithread'
    benchmark: >-
      OMP_NUM_THREADS=8 OMP_DYNAMIC=FALSE OMP_PROC_BIND=close
      OMP_PLACES=cores OMP_WAIT_POLICY=PASSIVE
      taskset -c 0-7 env PYTHONPATH=src
      .venv/bin/python tests/bench_moe_avx512_bf16.py --backend
      x86_amx_bf16 --tokens 2048 --hidden 4096 --intermediate 512
      --experts 3 --top-k 1 --routing skewed --threads 8 --warmup 8
      --runs 31 --baseline-runs 11

variants:
  - id: pytorch_onednn_staged_avx512
    features: []
    entrypoint: >-
      ONEDNN_MAX_CPU_ISA=AVX512_CORE_BF16 fused_moe_naive
    status: reference

  - id: onednn_bf16_expert_basic
    features:
      - compute.onednn_bf16_expert_matmuls
      - epilogue.onednn_primitive_silu_mul
    entrypoint: >-
      The basic result from benchmarks/bench_onednn_bf16_expert with optional
      ONEDNN_MAX_CPU_ISA selection
    status: experimental

  - id: onednn_bf16_expert_postop_fused
    features:
