  - id: sve_w2_bf16_direct_route
    features:
      - store.w2_direct_route
      - store.w2_direct_bf16_route
    entrypoint: >-
      FUSED_CPP_MOE_W2_BF16_ROUTE=1
      fused_moe_bf16_tiled_{sync,scheduled,async}
    status: experimental

  - id: sve_fused_expert_serial_weight_windows
    features:
      - intermediate.overwrite_elision
      - scatter.w2_n_owner
      - dispatch.serial_weight_windows
    entrypoint: >-
      fused_moe_bf16_tiled_{scheduled,async}(
      weight_window_bytes=<positive byte count>)
    status: experimental

  - id: sve_plan_v2_per_task_stage_windows
    features:
      - intermediate.overwrite_elision
      - scatter.w2_n_owner
      - dispatch.serial_weight_windows
      - dispatch.per_task_stage_windows
    entrypoint: >-
      PlannedMoE(default profile-bound policy;
      use_default_stage_window_policy=False to disable) ->
      fused_moe_bf16_tiled_async_plan(AsyncMoEPlanV2(
      task_w13_window_bytes=..., task_w2_window_bytes=...))
    status: enabled

  - id: sve_vllm_staged_task_pool
    features:
      - dispatch.global_stage_task_pool
      - store.w2_direct_route
      - merge.sve_weighted_reduce
    entrypoint: fused_moe_bf16_tiled_vllm_staged
    status: experimental

  - id: sve_planned_global_two_stage
    features:
      - dispatch.planned_global_stages
      - dispatch.per_task_stage_windows
      - store.w2_direct_route
      - merge.sve_weighted_reduce
    entrypoint: >-
      fused_moe_bf16_tiled_planned_staged(
      w13_plan=AsyncMoEPlanV2(...), w2_plan=AsyncMoEPlanV2(...))
    status: experimental

  - id: sve_w2_boundary_elastic
    features:
      - dispatch.w2_boundary_elastic
      - store.w2_direct_route
      - dispatch.per_task_stage_windows
    entrypoint: >-
      fused_moe_bf16_tiled_async_plan
      (Plan V2 execution_mode=elastic, resize point before W2)
    status: experimental

  - id: sve_static_16t_to_4x4t
    features:
      - dispatch.static_team_fission
      - store.w2_direct_route
      - store.w2_direct_bf16_route
      - merge.sve_weighted_reduce
    entrypoint: >-
      bench_vllm_staged_schedule.py --static-16-to-4
      (benchmark-only external async DAG)
    status: experimental

  - id: sve_dynamic_16t_to_4t_pool
    features:
      - dispatch.dynamic_short_expert_pool
      - store.w2_direct_route
      - store.w2_direct_bf16_route
      - merge.sve_weighted_reduce
    entrypoint: >-
      bench_vllm_staged_schedule.py --dynamic-short-pool
      (forced-4T benchmark comparator using the native async executor)
    status: experimental

  - id: sve_planner_selected_tail_pool
    features:
      - dispatch.dynamic_short_expert_pool
      - planner.native_cold_search
      - store.w2_direct_route
      - store.w2_direct_bf16_route
      - merge.sve_weighted_reduce
    entrypoint: >-
      PlannedMoE.plan_spec_for (default dynamic_tail_pool=True)
      fused_moe_bf16_tiled_async_plan
    status: enabled

  - id: sve_route_merge_sequential
    features: []
    entrypoint: >-
      FUSED_CPP_MOE_SVE_ROUTE_MERGE_UNROLL=0
      fused_moe_bf16_tiled_{sync,scheduled,async}
    status: reference

  - id: sve_route_merge_u1
    features:
      - merge.sve_weighted_reduce
    entrypoint: >-
      fused_moe_bf16_tiled_{sync,scheduled,async}
      (SVE default; FUSED_CPP_MOE_SVE_ROUTE_MERGE_UNROLL=1 is equivalent)
    status: enabled

  - id: sve_async_ready_token_merge
    features:
      - store.w2_direct_route
      - merge.async_ready_tokens
      - merge.sve_weighted_reduce
    entrypoint: >-
      fused_moe_bf16_tiled_async
      (default; FUSED_CPP_MOE_ASYNC_READY_TOKEN_MERGE=1 is equivalent,
      value 0 selects the post-expert fallback)
    status: enabled

  - id: sve_route_merge_u2
    features:
      - merge.sve_weighted_reduce
    entrypoint: >-
      FUSED_CPP_MOE_SVE_ROUTE_MERGE_UNROLL=2
      fused_moe_bf16_tiled_{sync,scheduled,async}
    status: experimental

  - id: sve_route_merge_u4
    features:
      - merge.sve_weighted_reduce
    entrypoint: >-
      FUSED_CPP_MOE_SVE_ROUTE_MERGE_UNROLL=4
      fused_moe_bf16_tiled_{sync,scheduled,async}
    status: experimental

  - id: sve_explicit_unfused_expert
    features:
      - pipeline.explicit_unfused_reference
    entrypoint: unfused::Experiment::run(kExplicitUnfused)
    status: benchmark_reference

  - id: sve_fully_fused_expert_control
    features: []
    entrypoint: unfused::Experiment::run(kProductionFused)
    status: benchmark_reference

  - id: sve_single_core_unique_weight_window
    features:
