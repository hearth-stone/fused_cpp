  - id: merge.async_ready_tokens
    part: merge
    status: enabled
    implementation: csrc/moe/arm/common/fused_moe_bf16_tiled.cpp
    hypothesis: >-
      Publishing expert completion and letting otherwise idle async workers
      merge tokens whose full TopK predecessor set is ready can hide route
      combine under an imbalanced expert tail. Assigning each logical worker
      the same contiguous token range used by final merge removes global queue
      claims and preserves route-output locality. Each worker advances one
      ready owned token at an expert boundary; after compute completes, the
      resident workers drain their own ranges in two-token batches with
      one-token lookahead prefetch, without changing numerical association.
    depends_on:
      - store.w2_direct_route
      - merge.sve_weighted_reduce
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
