  - id: dispatch.stage_window_tiles
    part: dispatch
    status: enabled
    implementation: >-
      cpu_moe_schedule_optimization/planners/stage_window_policy.py;
      cpu_moe_schedule_optimization/planners/interval_planner.py;
      cpu_moe_schedule_optimization/cost_model/full_stage_geometry.py;
      src/fused_cpp/moe/plan.py;
      csrc/moe/arm/common/fused_moe_bf16_tiled.cpp
    hypothesis: >-
      A stage's computation pattern is determined by the pair (team width,
      per-thread owner window in whole N tiles), and the window is worth
      selecting rather than deriving from the width. The full stripe is the R=1
      endpoint, so the mechanism is a superset of dispatch.full_n_team_stripes
      and defaults to it bit for bit. Windows only reorder the (M panel, window)
      traversal, so any legal window is bitwise identical. Measured: the full
      stripe costs 75-104% at four threads, 23-31% at eight and 4-15% at sixteen
      through route 120, but wins from route 144 at sixteen threads, where a
      one-tile window costs up to 80% because a wide window is what amortizes A
      rescans. The policy therefore covers only the measured region and falls
      back to the full stripe elsewhere. Reported gains on planner-generated
      plans are 12.4% on moe256-uniform and 10.6% on dsv4-real-2048-seq70, with
      moe256-tiered-hotspot and moe256-active-set-128 inside a 1.3-1.7% noise
      floor.
    depends_on:
      - dispatch.full_n_team_stripes
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_moe_stage_window_plan.py
      tests/test_moe_plan_v2.py
      tests/test_moe_cost_model_v2.py
    benchmark: >-
      see optimizations/fused_moe_sve/results/amazon_192c_stage_window_tiles_20260810.md
      for the sweep driver and the end-to-end A/B; current experiments set
      task_w13_window_tiles/task_w2_window_tiles explicitly in Plan V2

