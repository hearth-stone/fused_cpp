operator: fused_moe_sve

baseline:
  id: sve_static_nsplit
  implementation: csrc/moe/arm/common/fused_moe_bf16_tiled.cpp
  entrypoint: team_fused_w13_silu_packed_packc_sve
  status: reference

features:
  - id: weights.hugetlbfs_backing
    part: weights
    status: enabled
    implementation: src/fused_cpp/moe/bf16_tiled.py
    hypothesis: >-
      Copying only reusable packed W13/W2 tensors into an explicitly selected
      hugetlbfs mount reduces packed-weight DTLB and page-walk overhead without
      changing the native packed layout, kernel dispatch, or numerical output.
      Allocation is machine opt-in and must fail rather than silently fall back
      when the configured HugeTLB pool is unavailable.
    depends_on: []
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_moe_hugetlbfs.py
      tests/test_fused_moe_bf16_tiled.py::test_sve_m12_silu_and_w2_bf16_route_for_unit_top1
    benchmark: >-
      FUSED_CPP_MOE_HUGETLBFS_PATH=/dev/hugepages-32M
      numactl --cpunodebind=0 --membind=0 taskset -c 0-95
      .venv/bin/python
      cpu_moe_schedule_optimization/cost_model/profile_contention_async.py
      --output /tmp/m1_1t_hugetlb32m.json --cpu-ids 0-95
      --num-experts 256 --measurement-experts 96
      --isolated-measurement-experts 8 --isolated-route-buckets 1
      --contention-route-buckets 1 --thread-buckets 1
      --contention-shapes 1x96 --w13-ranges 2 --w2-ranges 1
      --warmup 12 --runs 101

  - id: compute.xbyak_exact_m
    part: compute
    status: enabled
    implementation: >-
      csrc/moe/arm/sve_bf16/jit_kernels.cpp and
      csrc/moe/arm/common/fused_moe_bf16_tiled.cpp
    hypothesis: >-
      Generating the existing packed-A SVE BFMMLA body for each logical M from
      1 through 12 removes M4/M8/M12 tail overcompute while preserving the
      static kernel ABI, weight layout, fused SiLU/packC epilogue, and direct
      W2 route stores. Full M12 panels should remain throughput-neutral.
    depends_on: []
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src FUSED_CPP_MOE_SVE=1 .venv/bin/python -m pytest -q
      tests/test_fused_moe_bf16_tiled.py
      -k 'sve_xbyak_exact_m_matches_static_asm or
      sve_w2_direct_route_store_matches_scatter'
    benchmark: >-
      numactl --cpunodebind=0 --membind=0 taskset -c 0-95
      .venv/bin/python
      optimizations/fused_moe_sve/benchmarks/bench_xbyak_exact_m.py
      --routes 5,6,9,10,12,192,2040 --threads 1,4,8,16,32,64,96
      --warmup 3 --runs 11 --switch-period 5

  - id: compute.xbyak_double_buffer_kloop
    part: compute
    status: enabled
    implementation: csrc/moe/arm/sve_bf16/jit_kernels.cpp
    hypothesis: >-
      Reproducing the static M2/M4/M8 preload, alternating A/B register banks,
      and current/next tail state machine for generated M<=8 kernels hides load
      latency without changing exact-M arithmetic. Equal-compute-height M1-4
      and M7/8 should return to within 1 percent of static assembly throughput.
    depends_on:
      - compute.xbyak_exact_m
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src FUSED_CPP_MOE_SVE=1 .venv/bin/python -m pytest -q
      tests/test_fused_moe_bf16_tiled.py
      -k 'sve_xbyak_exact_m_matches_static_asm or
      sve_w2_direct_route_store_matches_scatter'
    benchmark: >-
      numactl --cpunodebind=0 --membind=0 taskset -c 0-7
