  - id: measurement.short_route_stage_windows
    part: measurement
    status: retired
    implementation: >-
      Removed from the active tree; retained in Git history and historical
      result documents only.
    history: 0962179
    hypothesis: >-
      The kernel loops M panels outside and N tiles inside, so every additional
      M12 panel walks the whole packed-B stage window again. Useful packed-B
      bandwidth should therefore be governed by the per-thread window
      window_bytes/threads rather than by team width or window target alone, and
      should degrade by up to ceil(M/12) when that per-thread slice no longer
      stays resident. The calibrated default policy has no route band below 49
      routes, so short-route experts should be recoverable by adding one band.
    depends_on: []
    conflicts_with: []
    correctness: historical
    benchmark: historical
    result: >-
      On AmazonC5192Cores NUMA0 the effective packed-B re-read factor at M=28
      falls monotonically from 2.97 to 1.22 as the per-thread window shrinks
      from 4 MiB to 0.25 MiB, matching the ceil(M/12)=3 upper bound at 4 MiB.
      Four team widths agree within 3.0-5.6 percent at equal per-thread window,
      so width is second order. The M=12 control varies by 0.7 percent because a
      single M panel has no packed-B reuse. Varying the active core count at
      fixed team width rejects the shared-LLC capacity hypothesis with the wrong
      sign: at a fixed 12 MiB aggregate window the factor spans 2.35 to 1.20 and
      tracks the per-thread window, while holding the per-thread window fixed and
      growing the aggregate eightfold improves it by 1.36-1.77x. The
      deterministic g(M, t) form therefore needs no active-core term, and the
      effective retained capacity is about one eighth of the nominal private L2.
      An end-to-end A/B with a candidate
      13-48 route band improved dsv4-real-2048-seq70 by 7.36 percent and
      moe256-uniform by 24.20 percent, while three presets with no in-band
      expert moved by at most 0.34 percent. That band is now the production
      default: the policy input unit changed from per-range bytes to the
      per-thread window, which collapsed the calibrated V1 table from 26 numbers
      to 8 plus 6 one-step deviations, and the band landed as
      amazon_c5_192c_tp4_f512_v2. Re-measured default against default in one
      session it gives 7.59 and 24.29 percent, with the three unaffected presets
      inside a noise floor set by the policy-free legacy variant. Still
      uncalibrated: W13 and W2 share one per-thread window, and widths above 8
      remain uncovered because widening coverage flips the cost model's
      full-workload anchor and must be measured. Only one host and profile
      identity were tested. A follow-up two-dimensional W13/W2 per-thread window
      sweep reproduced the calibrated pair exactly at M=28, M=120 and M=320,
      which independently validates both the table and the per-thread
      parameterization. W13 is the strong axis, where one step off the peak costs
      3 to 30 percent, and W2 is weak, under 1.5 percent across three or four
      values at the peak W13, so sharing one window between the stages does not
      materially understate the gains. The H/F=8 shared-A argument holds only at
      large M: at M<=48 both stages' shared-A fits private L2 and W2 prefers the
      larger window instead. A candidate w13=0.125 MiB for the 13-48 band was
      rejected because M=28 peaks at the current value and end to end it only
      gains on moe256-uniform by flipping the shape from 8T to 1T, below the 2
      percent adoption threshold. A width sweep at fixed per-thread window then
      bounded the invariance to 1 through 8 threads: at 16 and 32 threads the
      width itself costs 13 to 39 percent. That does not matter for the policy
      because the inherited legacy geometry is itself a per-thread window of
      4 MiB divided by the team width, so wide teams already sit near the
      optimum and only 0.8 to 8.5 percent remains there. The real gap was the
      narrow end of the 49-95 band, which V1 calibrated at 8 threads only and
      where the inherited window is 32x to 8x too large; filling 1, 2 and 4
      threads is worth 3.39x, 2.94x and 1.65x of isolated bandwidth at M=72.
      That landed as amazon_c5_192c_tp4_f512_v3. No catalog preset plans a 49-95
      route expert below 8 threads, so V2 and V3 build element-identical plans on
      all five presets and the gain is latent. A follow-up sweep then located the
      threshold that sets the optimum: under an N-split team each thread scans all
      of A inside a range, so the per-thread scan is 2*M*K, and the optimum
      saturates exactly where that fills private L2, at M=256 for W13 and M=2048
      for W2, a ratio of H/F=8.
      That exposed a defect in the V1 table, whose 144-287 band used one eighth of
      a MiB per thread across its whole range while everything from M=224 up wants
      one half: at M=256 the old value costs 61 percent at one thread and 23
      percent at four. amazon_c5_192c_tp4_f512_v4 splits that band at 216 route,
      an integral number of M12 panels. Only three of dsv4-real-2048-seq70's 223
      tasks land in the new band, so the five presets again move within noise and
      the gain is latent. An earlier evaluation kept the boolean W13 selector
      because the calibrated bands cover only 52 percent of the route-width
      grid. The range-native migration preserves both measured endpoint
      geometries as exact R13 identities and materializes a positive R13/R2 for
      every task, so the boolean selector is no longer part of the search or
      runtime contract. Two
      later corrections do not change any calibrated value but do bound how the
      table may be read. First, the table assumes huge pages: an earlier base-page
      control was invalid because plain aligned allocation inherited transparent
      huge pages from a recycled arena, and with a real MADV_NOHUGEPAGE control the
      page size is worth 13.2 percent on streamed weights, crossing over from 4 KiB
      to 2 MiB rather than 2 MiB to 32 MiB. The two huge-page arms still agree cell
      for cell, so production, which defaults to thp, is unaffected, but at M=28 the
      base-page optimum is two steps smaller and the banded value costs 5.5 percent
      there. Second, the per-thread window only denotes a per-thread footprint under
      an N-split team; choose_moe_gemm_split takes the M axis for W13 at two points
      inside the bands, M<=32 at two threads and M>=512 at eight, where each thread
      instead holds the whole range. The window must therefore not be extrapolated
      across those boundaries. Planning all nine presets and binning tasks by route
      and chosen width then showed the table has only six live cells of twenty-four:
      every one and two thread cell is dead, four threads is reached only in 96-143,
      and 285 tasks inherit the operator-wide window, including all of
      moe256-long-short-bimodal. That is the direct explanation for three latent
      gains, so coverage is worth checking before a cell is calibrated. The one live
      four-thread cell also carries an in-band gradient: 0.125 MiB per thread beats
      the shipped 0.0625 by 0.28, 1.44 and 3.26 percent at route 96, 108 and 120, and
      moe256-active-set-128 sits at exactly route 96, on the crossover, so the value
      stays and the 100-143 deficit is recorded instead. See
      results/amazon_192c_short_route_stage_windows_20260806.md.

