    correctness: historical; restore history commit 94e977d to reproduce
    benchmark: historical; restore history commit 94e977d to reproduce
    result: >-
      On AmazonC5192Cores NUMA0, fixed 12x8T measured 14.854 ms and
      10.409 TFLOP/s. The fully timed mixed incumbent measured 20.869 ms and
      7.409 TFLOP/s, a 28.82 percent throughput regression. A 0.25x release
      differed from eager mixed execution by only 0.03 percent, so the gate is
      not the regression; the cold-only surrogate omitted sustained lower-cache
      and active-set contention. Follow-up traces measured only 57.18 of 96
      cores active on average versus 93.51 for fixed, while mixed W13/W2 peak
      windows reached 201.5/161.5 MiB on a 96 MiB L3 and increased L2 refill
      and last-level read misses by 19.1/21.5 percent. Restricting the oracle to
      at least 4T recovered to 15.087 ms, within 2.00 percent of fixed
      throughput. The candidate is rejected for production.
