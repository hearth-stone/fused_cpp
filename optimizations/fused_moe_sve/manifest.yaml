  - id: measurement.analytic_service_kernels
    part: measurement
    status: experimental
    owner: zhangxu
    opened: 2026-08-11
    decision_by: 2026-11-09
    next_decision: >-
      Keep the fused-W13 restart service only if a second ARM machine consumes
      it and the stage-window holdout remains below the declared regret gate.
    adoption_gate: >-
      The service must remain an independently measurable machine/kernel
      constant, fit randomized range counts within 1 percent, and improve an
      unseen full-Cartesian selector holdout without adding route-time samples.
    implementation: >-
      csrc/moe/arm/sve_bf16/jit_kernels.cpp,
      csrc/moe/arm/common/fused_moe_bf16_tiled.cpp, and
      cpu_moe_schedule_optimization/cost_model/profile_analytic_services.py
    hypothesis: >-
      Four stable generated services are sufficient for thin machine
      calibration: B-only measures endpoint-to-register packed-weight service,
      M12 full-no-store measures the executable L1/L2 GEMM core ceiling, and
      M12 matrix-only preserves register-only arithmetic provenance. A fused
      W13 SiLU/packC service separately measures the per-panel cost of restarting
      an N range, because the pure-GEMM restart does not execute that epilogue.
      Their numeric mode ids remain stable because profile files record them.
    depends_on:
      - compute.xbyak_exact_m
      - compute.xbyak_double_buffer_kloop
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src FUSED_CPP_MOE_SVE=1 .venv/bin/python -m pytest -q
      tests/test_fused_moe_bf16_tiled.py -k service_probe
    benchmark: >-
      PYTHONPATH=src numactl --cpunodebind=0 --membind=0 taskset -c 0-95
      .venv/bin/python
      cpu_moe_schedule_optimization/cost_model/profile_analytic_services.py
      --output /tmp/moe_analytic_services.json --cpu-ids 0-95
      --range-warmup 256 --range-runs 8192 --range-repeats 7
    result: >-
      These services feed the analytical machine calibration. On
      AmazonC5192Cores NUMA0 the randomized M12/K264/N64 L1-hot fit measured
      6.70 ns per extra pure-GEMM panel/range and 45.27 ns for fused W13; the
      maximum fit errors were 0.180 and 0.087 percent. The calibration remains
      shadow-only; see
      results/analytic_stage_window_policy_v6_closure_20260811.md.

