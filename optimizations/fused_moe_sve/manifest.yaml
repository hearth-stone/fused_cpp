      --warmup 32 --runs 201

  - id: compute.upstream_m8_m12_ilv
    part: compute
    status: retired
    implementation: Removed from the active benchmark; retained in Git history.
    history: fe0ca5a
    hypothesis: >-
      Interleaving packed-A loads with BFMMLA instructions in the upstream M8
      and M12 schedules may hide load latency better than the matching
      non-ILV schedules. Adoption requires a stable gain above 2 percent for
      both warm and rotating-cold W13/W2 shapes on SVE128 and SVE256, without
      a material regression in either M kernel.
    depends_on:
      - compute.xbyak_pure_gemm
    conflicts_with: []
    correctness: historical; restore Git fe0ca5a to reproduce
    benchmark: historical; restore Git fe0ca5a to reproduce
    result: >-
      Rejected on 2026-07-26. M8 regressed by up to 5.40 percent on
      Neoverse-V3, while M12 gains were generally below 1.1 percent and did
      not clear the cross-machine adoption threshold. Full measurements are
      in results/amazon_8c_192c_upstream_m8_m12_ilv.md.

  - id: compute.xbyak_m12_column_pipeline
    part: compute
    status: retired
    implementation: Removed from the active tree; retained in Git history.
    history: 4825bf9
    hypothesis: >-
      Keeping all six M12 packed-A row pairs live while ping-ponging two
      packed-B column registers spaces the four six-BFMMLA groups with B loads
      and pointer updates. The unchanged instruction and traffic counts should
      reduce vector issue-queue backpressure above 48 active Neoverse-V3 cores
      without reducing single-core throughput. Use the existing kernel-schedule
      gate: adoption requires a stable gain above 2 percent without a material
      single-core regression.
    depends_on:
      - compute.xbyak_pure_gemm
    conflicts_with:
      - compute.upstream_m8_m12_ilv
    correctness: historical; restore history commit 4825bf9 to reproduce
    benchmark: historical; restore history commit 4825bf9 to reproduce
    result: >-
      Rejected on 2026-08-02. A 21-repeat 96-core run improved median
      throughput from 30.420 to 30.617 TFLOP/s (+0.648 percent) and linear
      efficiency from 91.681 to 92.273 percent, below the 2 percent adoption
      threshold. DISPATCH_STALL_IQ_VX increased by about 37.5 percent rather
      than falling. Its JIT modes and benchmark sources were removed from the
      active tree on 2026-08-10; production dispatch remains unchanged. Full
      measurements are in
      results/amazon_192c_m12_column_pipeline_20260802.md.

  - id: compute.xbyak_m2_dual_n
    part: compute
    status: retired
    implementation: Removed from the active tree; retained in Git history.
    history: f671f7e
    hypothesis: >-
      Computing two adjacent N tiles in one M1/M2 K loop shares the packed-A
      load and loop control. Restricting the path to K>=1024 avoids the
      short-K W2 regression, while a shared W13 epilogue reuses packC offsets
      and SiLU constants across both tiles. The path should improve cold-weight
      throughput only while aggregate B-stream pressure remains below the
      NUMA memory-system saturation region.
    depends_on:
      - compute.xbyak_exact_m
      - compute.xbyak_double_buffer_kloop
    conflicts_with: []
    correctness: historical; restore history commit f671f7e to reproduce
    benchmark: historical; restore history commit f671f7e to reproduce
    result: >-
      Retired on 2026-08-10. It improved 8-way M1/M2 waves by about 2.3
      percent, but regressed 24-way waves by 5.4-5.7 percent and 96-way M2 by
      5.0 percent because lane-time variance was amplified at wave barriers.
      A safe selector would require planner-visible concurrency and barrier
      topology, so the environment flag, generated two-N state machine, cache
      dimension, test branch, and benchmark selector no longer justify active
      maintenance. Full evidence remains in
      results/amazon_192c_xbyak_m2_dual_n.md.

