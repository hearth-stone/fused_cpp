  - id: measurement.gemm_operand_memory_services
    part: measurement
    status: experimental
    implementation: >-
      csrc/moe/arm/common/fused_moe_bf16_tiled.cpp and
      cpu_moe_schedule_optimization/cost_model/profile_gemm_memory_services.py
      and cpu_moe_schedule_optimization/cost_model/validate_gemm_four_state.py
    hypothesis: >-
      A GEMM generates different memory-service demand when packed A is hot and
      packed B streams, packed B is hot and packed A streams, or both operands
      stream. Measuring the production M12 full-no-store instruction body with
      independently rotating A and B windows gives phase-specific,
      GEMM-consumable bandwidth curves without substituting generic STREAM
      bandwidth for the kernel request pattern.
    depends_on:
      - measurement.analytic_service_kernels
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_gemm_memory_service_probe.py
      tests/test_fused_moe_bf16_tiled.py -k m12_service_probe
    benchmark: >-
      FUSED_CPP_MOE_HUGETLBFS_PATH=/dev/hugepages-32M
      PYTHONPATH=src numactl --cpunodebind=0 --membind=0 taskset -c 0-95
