operator: fused_moe_sve

baseline:
  id: sve_static_nsplit
  implementation: csrc/moe/arm/common/fused_moe_bf16_tiled.cpp
  entrypoint: team_fused_w13_silu_packed_packc_sve
  status: reference

features:
  - id: compute.m_epoch
    part: compute
    status: experimental
    implementation: optimizations/fused_moe_sve/features/elastic_nsplit.cpp
    hypothesis: >-
      Calling the existing M12 SVE kernels on row epochs of at least 204 rows
      costs less than 3 percent versus one full-M call while exposing bounded
      points at which an expert can change its N-split width.
    depends_on: []
    conflicts_with: []
    correctness: make -C optimizations/fused_moe_sve/benchmarks check
    benchmark: >-
      numactl --cpunodebind=0 --membind=0 taskset -c 0-95
      optimizations/fused_moe_sve/benchmarks/bench_elastic_nsplit
      --stage w13 --m 2040 --k 4096 --n 4096 --threads 96
      --epoch-rows 204 --warmup 3 --iters 9 --copies 4

  - id: intermediate.overwrite_elision
    part: intermediate
    status: enabled
    implementation: csrc/moe/arm/common/fused_moe_bf16_tiled.cpp
    hypothesis: >-
      The fused SVE W13 kernels overwrite every packed-intermediate element
      consumed by the matching W2 tail kernel, so removing the full-buffer zero
      and its team barrier preserves bitwise output and reduces short-expert
      latency.
    depends_on: []
    conflicts_with: []
    correctness: >-
      pytest -q tests/test_fused_moe_bf16_tiled.py
      -k expert_barrier_elision_reuses_dirty_scratch
    benchmark: >-
      numactl --cpunodebind=0 --membind=0 taskset -c 0-95
      .venv/bin/python
      optimizations/fused_moe_sve/benchmarks/bench_expert_barriers.py
      --warmup 4 --runs 17 --sample-ms 10

  - id: scatter.w2_n_owner
    part: scatter
    status: enabled
    implementation: csrc/moe/arm/common/fused_moe_bf16_tiled.cpp
    hypothesis: >-
      Assigning scatter the exact n_tile-aligned range produced by the same W2
      worker removes the W2-to-scatter team barrier without cross-thread reads
      and reduces short-expert latency.
    depends_on: []
    conflicts_with: []
    correctness: >-
      pytest -q tests/test_fused_moe_bf16_tiled.py
      -k expert_barrier_elision_reuses_dirty_scratch
    benchmark: >-
      numactl --cpunodebind=0 --membind=0 taskset -c 0-95
      .venv/bin/python
      optimizations/fused_moe_sve/benchmarks/bench_expert_barriers.py
      --warmup 4 --runs 17 --sample-ms 10

  - id: store.w2_direct_route
    part: store
    status: enabled
    implementation: >-
      csrc/moe/arm/sve_bf16/kernels.S and csrc/moe/arm/common/fused_moe_bf16_tiled.cpp
    hypothesis: >-
      Giving the SVE W2 epilogue the flat route-row table lets each N owner
      store its disjoint FP32 columns directly into route_out. For long routes,
      eliminating the contiguous down materialization and the following
      scatter saves more time than the irregular row-address generation adds
      to W2, while preserving the existing FP32 weighted-merge contract.
    depends_on: []
    conflicts_with:
      - scatter.w2_n_owner
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_fused_moe_bf16_tiled.py
      -k w2_direct_route_store_matches_scatter
    benchmark: >-
      numactl --cpunodebind=0 --membind=0 taskset -c 0-95
      .venv/bin/python
      optimizations/fused_moe_sve/benchmarks/bench_w2_direct_route.py
      --path async --tokens 2048 --hidden 4096 --intermediate 512
      --experts 8 --top-k 6 --threads 96 --warmup 5 --runs 31

  - id: store.w2_direct_bf16_route
    part: store
    status: experimental
    implementation: >-
      csrc/moe/arm/sve_bf16/kernels.S and csrc/moe/arm/common/fused_moe_bf16_tiled.cpp
    hypothesis: >-
      Converting W2 accumulators to BF16 in the direct-route assembly epilogue
      halves route-buffer stores and weighted-merge source reads while retaining
      FP32 top-k accumulation. Long routes should recover this traffic saving;
      short routes may not amortize BF16 conversion and address setup.
    depends_on:
      - store.w2_direct_route
    conflicts_with:
      - scatter.w2_n_owner
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_fused_moe_bf16_tiled.py
      -k w2_direct_route_store_matches_scatter
    benchmark: >-
      numactl --cpunodebind=0 --membind=0 taskset -c 0-95
      .venv/bin/python
      optimizations/fused_moe_sve/benchmarks/bench_w2_direct_route.py
      --path async --tokens 2048 --hidden 4096 --intermediate 512
      --experts 8 --top-k 6 --threads 96 --warmup 5 --runs 31

  - id: dispatch.elastic_n_lanes
    part: dispatch
    status: experimental
    implementation: optimizations/fused_moe_sve/features/elastic_nsplit.cpp
    hypothesis: >-
      Dynamically claiming one contiguous N lane for each constant-width M
      phase, with a barrier only where the lane count changes, adds less than
      5 percent overhead over the epoch-only variant and preserves the A-panel
      traffic model proportional to participating lanes.
    depends_on:
      - compute.m_epoch
    conflicts_with: []
    correctness: make -C optimizations/fused_moe_sve/benchmarks check
    benchmark: >-
      numactl --cpunodebind=0 --membind=0 taskset -c 0-95
      optimizations/fused_moe_sve/benchmarks/bench_elastic_nsplit
      --stage w13 --m 2040 --k 4096 --n 4096 --threads 96
      --epoch-rows 204 --warmup 3 --iters 9 --copies 4

  - id: dispatch.global_stage_task_pool
    part: dispatch
    status: experimental
    implementation: >-
      csrc/moe/arm/common/fused_moe_bf16_tiled.cpp and
      src/fused_cpp/moe/bf16_tiled.py
    hypothesis: >-
      A global dynamic queue of contiguous (expert, N-range) tasks can reduce
      fixed-team tail imbalance enough to offset its global W13/W2 barrier and
      repeated per-range A gather-pack. Reusing the production packed weights,
      M12 SVE GEMM bodies, direct route store, and merge isolates that scheduling
      tradeoff from kernel differences.
    depends_on:
      - store.w2_direct_route
    conflicts_with:
      - dispatch.elastic_n_lanes
      - merge.async_ready_tokens
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_moe_w13_split_api.py
      tests/test_fused_moe_bf16_tiled.py
      -k vllm_staged
    benchmark: >-
      numactl --cpunodebind=0 --membind=0 taskset -c 0-95
      .venv/bin/python
      optimizations/fused_moe_sve/benchmarks/bench_vllm_staged_schedule.py
      --tokens 2048 --hidden 4096 --intermediate 512
      --experts 256 --top-k 6 --threads 96
      --distribution hot-topk --team-threads 16
      --warmup 3 --runs 11

  - id: dispatch.serial_weight_windows
    part: dispatch
    status: experimental
    implementation: csrc/moe/arm/common/fused_moe_bf16_tiled.cpp
    hypothesis: >-
      Serializing both packed-B GEMMs into a configurable tile-aligned byte
      window reduces the active reusable weight footprint on machines whose
      robust cache budget is smaller than the existing W2-sized stage, without
      changing GEMM FLOPs or numerical output; range dispatch overhead and the
      reduced N-tile lane count remain measurable tradeoffs.
    depends_on: []
    conflicts_with: []
    correctness: >-
      pytest -q tests/test_moe_w13_split_api.py
      -k weight_window
    benchmark: >-
      numactl --cpunodebind=0 --membind=0 taskset -c 0-95
      .venv/bin/python
      optimizations/fused_moe_sve/benchmarks/bench_weight_windows.py
      --experts 24 --routes 2040 --hidden 4096 --intermediate 512
      --threads-per-expert 4 --window-mib 0,4,2,1 --warmup 3 --runs 9

  - id: pipeline.explicit_unfused_reference
    part: pipeline
    status: experimental
    implementation: optimizations/fused_moe_sve/features/unfused_pipeline.cpp
    hypothesis: >-
      With preallocated buffers and the identical production M12 SVE GEMM
      body, direct gather-pack plus fused W13 SiLU/multiply/packC has lower
      expert wall time than explicitly materializing extract, both pack-A
      operations, FP32 W1/SiLU/W3 tensors, and the BF16 gated product.
    depends_on: []
    conflicts_with: []
    correctness: >-
      make -C optimizations/fused_moe_sve/benchmarks
      bench_unfused_pipeline &&
      optimizations/fused_moe_sve/benchmarks/bench_unfused_pipeline
      --experts 2 --m 24 --h 64 --f 64 --threads-per-expert 2
      --w13-ranges 2 --copies 1 --check
    benchmark: >-
      numactl --cpunodebind=0 --membind=0 taskset -c 0-95
      optimizations/fused_moe_sve/benchmarks/bench_unfused_pipeline
      --experts 4 --m 2040 --h 4096 --f 2048
      --threads-per-expert 24 --w13-ranges 2
      --warmup 3 --iters 10 --copies 2

  - id: merge.async_ready_tokens
    part: merge
    status: enabled
    implementation: csrc/moe/arm/common/fused_moe_bf16_tiled.cpp
    hypothesis: >-
      Publishing expert completion and letting otherwise idle async workers
      merge tokens whose full TopK predecessor set is ready can hide route
      combine under an imbalanced expert tail. Expert-first selection, batched
      publication, and a team-load imbalance gate should bound queue overhead
      without changing numerical association or the default executor.
    depends_on:
      - store.w2_direct_route
      - merge.sve_weighted_reduce
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_fused_moe_bf16_tiled.py
      -k async_ready_token_merge_overlaps_imbalanced_experts
    benchmark: >-
      numactl --cpunodebind=0 --membind=0 taskset -c 0-95
      .venv/bin/python
      optimizations/fused_moe_sve/benchmarks/bench_async_ready_token_merge.py
      --tokens 2048 --hidden 4096 --intermediate 512
      --experts 12 --top-k 6 --threads 96
      --distribution two-group --warmup 5 --runs 31

  - id: merge.sve_weighted_reduce
    part: merge
    status: enabled
    implementation: csrc/moe/arm/sve_bf16/route_merge.cpp
    hypothesis: >-
      Compile-time adjacent binary trees for top-k 2/4/6/8 and an ordered
      runtime-loop fallback for other values remove the thread-local FP32
      accumulator's repeated L1 load/store traffic without reducing
      compulsory route reads or output writes. Keeping 1, 2, or 4
      independent hidden-axis vectors exposes latency-hiding choices without
      changing the token-major route layout or final BF16 output contract.
    depends_on: []
    conflicts_with: []
    correctness: >-
      make -C optimizations/fused_moe_sve/benchmarks
      bench_route_merge_tree &&
      for top_k in 1 2 3 4 5 6 7 8 9; do
      optimizations/fused_moe_sve/benchmarks/bench_route_merge_tree
      --tokens 5 --top-k $top_k --hidden 103 --threads 4
      --source both --check || exit 1; done &&
      pytest -q tests/test_fused_moe_bf16_tiled.py
      -k sve_route_merge_matches_sequential
    benchmark: >-
      numactl --cpunodebind=0 --membind=0 taskset -c 0-95
      optimizations/fused_moe_sve/benchmarks/bench_route_merge_tree
      --tokens 2048 --top-k 6 --hidden 4096 --threads 96
      --copies 1 --source both --warmup 3 --runs 11 &&
      numactl --cpunodebind=0 --membind=0 taskset -c 0-95
      optimizations/fused_moe_sve/benchmarks/bench_route_merge_tree
      --tokens 2048 --top-k 6 --hidden 4096 --threads 96
      --copies 8 --source both --warmup 8 --runs 11 &&
      numactl --cpunodebind=0 --membind=0 taskset -c 0-95
      .venv/bin/python
      optimizations/fused_moe_sve/benchmarks/bench_route_merge_e2e.py
      --path async --tokens 2048 --hidden 4096 --intermediate 512
      --experts 8 --top-k 6 --threads 96 --warmup 5 --runs 31

  - id: measurement.single_core_unique_weight_window
    part: measurement
    status: diagnostic
    implementation: >-
      optimizations/fused_moe_sve/benchmarks/
      bench_single_core_weight_window.cpp
    hypothesis: >-
      Holding M and K fixed while increasing N exposes private-L2 and
      shared-LLC packed-weight residency boundaries, provided every GEMM call
      uses a distinct cold packed-B buffer and allocation is excluded from
      both timing and PMU counters.
    depends_on: []
    conflicts_with: []
    correctness: >-
      make -C optimizations/fused_moe_sve/benchmarks
      bench_single_core_weight_window &&
      optimizations/fused_moe_sve/benchmarks/
      bench_single_core_weight_window
      --m 24 --k 64 --n 64 --warmup 1 --runs 2
      --cold-tail-mib 1 --check
    benchmark: >-
      python3 optimizations/fused_moe_sve/benchmarks/
      run_single_core_weight_window.py
      --m 120 --k 4096 --cpu 48 --numa-node 0
      --warmup 2 --runs 7 --cold-tail-mib 192

  - id: load.m12_streaming_b
    part: load
    status: experimental
    implementation: >-
      optimizations/fused_moe_sve/benchmarks/
      m12_streaming_b_kernels.S and bench_m12_streaming_b.cpp
    hypothesis: >-
      For a cold M12 packed-B stream whose packed-A panel is larger than L1,
      one PLDL1STRM hint roughly 2 KiB ahead can overlap B latency with the
      unchanged BFMMLA body. A small-K W2 shape keeps packed A in L1 and must
      use an L2-only hint, if any, to avoid displacing A.
    depends_on: []
    conflicts_with: []
    correctness: >-
      make -C optimizations/fused_moe_sve/benchmarks
      check-m12-streaming-b
    benchmark: >-
      python3 optimizations/fused_moe_sve/benchmarks/
      run_m12_streaming_b.py
      --shape all --cpu 48 --numa-node 0
      --warmup 5 --runs 31 --cold-tail-mib 192

  - id: compute.m12_kblock_a_reuse
    part: compute
    status: experimental
    implementation: >-
      optimizations/fused_moe_sve/benchmarks/
      m12_streaming_b_kernels.S and bench_m12_streaming_b.cpp
    hypothesis: >-
      Interchanging the M12 loops to Kchunk, Ntile, K4 can retain one packed-A
      K slice in private L1 while preserving FP32 accumulation across chunks.
      The packed-B layout must also become Kchunk-major/Ntile-minor so the
      compulsory cold-weight traffic remains a contiguous stream. The reusable
      A+B window should target roughly half of private L1D, giving
      Kc ~= L1D_bytes / (4 * (M + n_tile)), then be adjusted to avoid a tiny
      final K chunk.
    depends_on: []
    conflicts_with: []
    correctness: >-
      make -C optimizations/fused_moe_sve/benchmarks
      check-m12-kblock
    benchmark: >-
      python3 optimizations/fused_moe_sve/benchmarks/
      run_m12_streaming_b.py
      --shape w13
      --variants kblock_packed_800
      --cpu 48 --numa-node 0 --warmup 5 --runs 51 --repeat 7
      --cold-tail-mib 192 --unique-scratch --prewarm-a

  - id: compute.msmall_kblock_a_reuse
    part: compute
    status: experimental
    implementation: >-
      optimizations/fused_moe_sve/benchmarks/
      msmall_kblock_kernels.S and bench_msmall_kblock.cpp
    hypothesis: >-
      The M12 half-L1 Kc rule must use the physical packed-A cache-line
      footprint for M8/M4/M2/M1. Because every small-M K4 block has a 64-byte
      A stride, their common half-L1 capacity ceiling is Kc ~= 1024 at SVE128.
      This ceiling is an approximate optimum only while A residency remains a
      material bottleneck; cold-B latency can create a broad lower-Kc plateau
      for M4/M2/M1.
    depends_on:
      - compute.m12_kblock_a_reuse
    conflicts_with: []
    correctness: >-
      make -C optimizations/fused_moe_sve/benchmarks
      check-msmall-kblock
    benchmark: >-
      for m in 8 4 2 1; do python3
      optimizations/fused_moe_sve/benchmarks/run_msmall_kblock.py
      --m $m --variants baseline,kblock
      --k-blocks 384,512,640,704,768,832,896,960,1024
      --cpu 48 --numa-node 0 --warmup 5 --runs 51 --repeat 5
      --cold-tail-mib 192 --unique-scratch --prewarm-a || exit 1; done

  - id: compute.production_kblock_a_reuse
    part: compute
    status: enabled
    implementation: >-
      csrc/moe/arm/sve_bf16/kernels.S,
      csrc/moe/arm/sve_bf16/packing.cpp, and
      csrc/moe/arm/common/fused_moe_bf16_tiled.cpp
    hypothesis: >-
      Packing B as Kchunk-major/Ntile-minor and keeping one common Kc for
      M12/M8/M4/M2 lets a reusable packed-A slice remain in private L1. The
      cross-machine maximin selector reserves 49 percent of detected L1D for
      one physical M12 A+B tile, giving Kc=800 at SVE128 and Kc=568 at SVE256.
      This is an isolated-kernel optimization: a saturated cold-expert wave
      can remain memory bound and lose to one K chunk because FP32 partial-C
      traffic is then pure overhead.
    depends_on:
      - compute.m12_kblock_a_reuse
      - compute.msmall_kblock_a_reuse
    conflicts_with: []
    correctness: >-
      pytest -q tests/test_fused_moe_bf16_tiled.py
      tests/test_moe_backend_dispatch.py
      -k 'sve_kc_path or sve or backend'
    benchmark: >-
      env -u FUSED_CPP_MOE_SVE_KC PYTHONPATH=src python3
      optimizations/fused_moe_sve/benchmarks/bench_weight_windows.py
      --experts 24 --routes 2040 --hidden 4096 --intermediate 512
      --threads-per-expert 4 --cpu-start 0 --window-mib 0
      --warmup 5 --runs 15

  - id: measurement.thread_weight_working_set
    part: measurement
    status: diagnostic
    implementation: >-
      optimizations/fused_moe_sve/benchmarks/
      run_thread_weight_working_set.py
    hypothesis: >-
      Under split-W13, N-splitting one expert preserves its aggregate packed-B
      stage while reducing each thread's stripe, whereas running one expert per
      thread grows the aggregate packed-B stage linearly unless the per-expert
      weight is reduced inversely with thread count. With a fixed total thread
      budget, several multi-thread expert teams can trade lower replicated-A
      demand for larger per-thread B stripes and a larger aggregate B stage.
    depends_on: []
    conflicts_with: []
    correctness: >-
      python -m pytest -q tests/test_thread_weight_working_set.py &&
      make -C optimizations/fused_moe_sve/benchmarks check
    benchmark: >-
      numactl --cpunodebind=0 --membind=0 taskset -c 0-95
      python optimizations/fused_moe_sve/benchmarks/
      run_thread_weight_working_set.py
      --output /tmp/split_w13_expert_team.json
      --experiments team-fixed-route,team-fixed-work
      --team-experts 1,2,3,4,6,8,12 --team-total-threads 96
      --team-route 2040 --team-total-routes 2304 --team-stage-mib 16
      --warmup 2 --runs 7

  - id: measurement.fixed_active_b_route_fragmentation
    part: measurement
    status: diagnostic
    implementation: >-
      optimizations/fused_moe_sve/benchmarks/
      bench_fragmented_route_pipeline.cpp and
      optimizations/fused_moe_sve/benchmarks/
      profile_fragmented_route_pipeline.py
    hypothesis: >-
      When total GEMM FLOPs, 96 workers, and a 96 MiB maximum active split-W13
      packed-B stage are fixed, replacing some M=2040 experts with more
      independent short-route experts has little effect until packed-weight
      turnover and per-expert fixed costs become comparable to GEMM work.
    depends_on: []
    conflicts_with: []
    correctness: >-
      python -m pytest -q tests/test_fragmented_route_pipeline.py &&
      make -C optimizations/fused_moe_sve/benchmarks
      bench_fragmented_route_pipeline &&
      optimizations/fused_moe_sve/benchmarks/
      bench_fragmented_route_pipeline
      --teams 2 --base-routes 24 --replaced-teams 1 --split-factor 2
      --hidden 64 --intermediate 64 --threads-per-team 2
      --schedule dynamic --w13-ranges 2 --copies 1 --check
    benchmark: >-
      python optimizations/fused_moe_sve/benchmarks/
      profile_fragmented_route_pipeline.py
      --output /tmp/fixed_active_b_fragmentation_perf.json
      --teams 24 --base-routes 2040 --hidden 4096 --intermediate 512
      --threads-per-team 4 --schedule dynamic --split-factors 1,2,5,10
      --cpu-start 0 --numa-node 0 --warmup 2 --runs 7 --repeats 3

variants:
  - id: sve_static_nsplit
    features: []
    entrypoint: elastic::Executor::run_static
    status: reference

  - id: sve_production_kc
    features:
      - compute.production_kblock_a_reuse
    entrypoint: >-
      fused_moe_bf16_tiled_{sync,scheduled,async,vllm_staged}
      (49 percent L1D Kc selector)
    status: enabled

  - id: sve_production_one_kchunk
    features:
      - compute.production_kblock_a_reuse
    entrypoint: >-
      FUSED_CPP_MOE_SVE_KC=1048576
      fused_moe_bf16_tiled_{sync,scheduled,async,vllm_staged}
    status: reference

  - id: sve_epoch_fixed_nsplit
    features:
      - compute.m_epoch
    entrypoint: elastic::Executor::run_epoch_fixed
    status: experimental

  - id: sve_epoch_claim_nsplit
    features:
      - compute.m_epoch
      - dispatch.elastic_n_lanes
    entrypoint: elastic::Executor::run_phase_claim
    status: experimental

  - id: sve_strict_epoch_claim_nsplit
    features:
      - compute.m_epoch
      - dispatch.elastic_n_lanes
    entrypoint: elastic::Executor::run_epoch_claim
    status: benchmark_reference

  - id: sve_fused_expert_barrier_baseline
    features: []
    entrypoint: >-
      FUSED_CPP_MOE_SVE_ELIDE_INTERMEDIATE_ZERO=0
      FUSED_CPP_MOE_SVE_W2_N_OWNER_SCATTER=0
      fused_moe_bf16_tiled_{scheduled,async}
    status: reference

  - id: sve_fused_expert_no_intermediate_zero
    features:
      - intermediate.overwrite_elision
    entrypoint: >-
      FUSED_CPP_MOE_SVE_ELIDE_INTERMEDIATE_ZERO=1
      FUSED_CPP_MOE_SVE_W2_N_OWNER_SCATTER=0
      fused_moe_bf16_tiled_{scheduled,async}
    status: candidate

  - id: sve_fused_expert_owner_scatter
    features:
      - scatter.w2_n_owner
    entrypoint: >-
      FUSED_CPP_MOE_SVE_ELIDE_INTERMEDIATE_ZERO=0
      FUSED_CPP_MOE_SVE_W2_N_OWNER_SCATTER=1
      fused_moe_bf16_tiled_{scheduled,async}
    status: candidate

  - id: sve_fused_expert_barrier_elision
    features:
      - intermediate.overwrite_elision
      - scatter.w2_n_owner
    entrypoint: >-
      FUSED_CPP_MOE_SVE_ELIDE_INTERMEDIATE_ZERO=1
      FUSED_CPP_MOE_SVE_W2_N_OWNER_SCATTER=1
      fused_moe_bf16_tiled_{scheduled,async}
    status: enabled

  - id: sve_w2_fp32_direct_route
    features:
      - store.w2_direct_route
    entrypoint: >-
      FUSED_CPP_MOE_W2_BF16_ROUTE=0
      fused_moe_bf16_tiled_{sync,scheduled,async}
    status: enabled

  - id: sve_w2_bf16_direct_route
    features:
      - store.w2_direct_route
      - store.w2_direct_bf16_route
    entrypoint: >-
      FUSED_CPP_MOE_W2_BF16_ROUTE=1
      fused_moe_bf16_tiled_{sync,scheduled,async}
    status: experimental

  - id: sve_fused_expert_serial_weight_windows
    features:
      - intermediate.overwrite_elision
      - scatter.w2_n_owner
      - dispatch.serial_weight_windows
    entrypoint: >-
      fused_moe_bf16_tiled_{scheduled,async}(
      weight_window_bytes=<positive byte count>)
    status: experimental

