  - id: compute.production_kblock_a_reuse
    part: compute
    status: retired
    implementation: >-
      Removed from the production configuration surface; historical runtime
      integration is retained in Git 44dbcd9. Standalone K-block probes remain
      under optimizations/fused_moe_sve/benchmarks/.
    history: 44dbcd9
    hypothesis: >-
      Packing B as Kchunk-major/Ntile-minor and keeping one common Kc for
      M12/M8/M4/M2 lets a reusable packed-A slice remain in private L1. An
      explicitly configured selector can reserve a calibrated fraction of
      detected L1D for one physical M12 A+B tile, giving Kc=800 at SVE128 and
      Kc=568 at SVE256 for the historical 49 percent setting. This is an
      isolated-kernel optimization: a saturated cold-expert wave remains
      memory bound and loses to one K chunk because FP32 partial-C traffic is
      then pure overhead. Production now exposes only one K chunk.
    depends_on:
      - compute.m12_kblock_a_reuse
      - compute.msmall_kblock_a_reuse
    conflicts_with: []
    correctness: historical; see results/amazon_192c_8c_production_kc.md
    benchmark: historical; the production integration remains in Git 44dbcd9.

  - id: measurement.thread_weight_working_set
    part: measurement
    status: diagnostic
    implementation: >-
      optimizations/fused_moe_sve/benchmarks/
      run_thread_weight_working_set.py
    hypothesis: >-
      With an exact two-range W13 geometry, N-partitioning one expert preserves
      its aggregate packed-B stage while reducing each thread's stripe, whereas
      running one expert per thread grows the aggregate packed-B stage linearly unless the per-expert
      weight is reduced inversely with thread count. With a fixed total thread
      budget, several multi-thread expert teams can trade lower replicated-A
      demand for larger per-thread B stripes and a larger aggregate B stage.
    depends_on: []
    conflicts_with: []
    correctness: >-
      python -m pytest -q tests/test_thread_weight_working_set.py &&
      make -C optimizations/fused_moe_sve/benchmarks check
    benchmark: >-
      numactl --cpunodebind=0 --membind=0 taskset -c 0-95
      python optimizations/fused_moe_sve/benchmarks/
      run_thread_weight_working_set.py
      --output /tmp/stage_range_expert_team.json
      --experiments team-fixed-route,team-fixed-work
      --team-experts 1,2,3,4,6,8,12 --team-total-threads 96
      --team-route 2040 --team-total-routes 2304 --team-stage-mib 16
      --warmup 2 --runs 7

  - id: measurement.fixed_active_b_route_fragmentation
    part: measurement
    status: diagnostic
    implementation: >-
