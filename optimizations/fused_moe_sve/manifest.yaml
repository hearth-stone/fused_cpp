    status: experimental

  - id: sve_msmall_kblock_probe
    features:
      - compute.msmall_kblock_a_reuse
    entrypoint: >-
      bench_msmall_kblock dynamic Kc entries
      (standalone only; no production dispatch)
    status: experimental

  - id: sve_fixed_active_b_fragmented_routes
    features:
      - measurement.fixed_active_b_route_fragmentation
    entrypoint: unfused::FragmentedExperiment::run
    status: diagnostic
