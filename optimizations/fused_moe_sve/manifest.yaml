      - compute.xbyak_double_buffer_kloop
      - load.w13_first_panel_prefetch
    entrypoint: >-
      FUSED_CPP_MOE_SVE_IMPL=jit
      FUSED_CPP_MOE_SVE_W13_FIRST_PANEL_PREFETCH=1
      fused_moe_bf16_tiled_{sync,scheduled,async,vllm_staged}
    status: retired

  - id: sve_all_first_panel_prefetch
    features:
      - compute.xbyak_exact_m
      - compute.xbyak_double_buffer_kloop
      - load.w13_first_panel_prefetch
      - load.w2_first_panel_prefetch
    entrypoint: >-
