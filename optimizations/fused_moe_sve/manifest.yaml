  - id: compute.xbyak_pure_gemm
    part: compute
    status: experimental
    implementation: >-
      csrc/moe/arm/sve_bf16/jit_kernels.cpp,
      csrc/moe/arm/common/fused_moe_bf16_tiled.cpp, and
      optimizations/fused_moe_sve/benchmarks/bench_jit_vs_i8mm_pure_gemm.cpp
    hypothesis: >-
      A standalone packed-A/packed-B BF16 GEMM operation with row-major FP32
      output makes the generated compute body independently reusable and
      measurable. Keeping its M1/M2/M4/M8 double-buffered and M12 non-ILV
      instruction schedules identical to the corresponding i8mm assembly
      kernels should keep median single-core time within 5 percent.
    depends_on:
      - compute.xbyak_exact_m
      - compute.xbyak_double_buffer_kloop
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src FUSED_CPP_MOE_SVE=1 .venv/bin/python -m pytest -q
      tests/test_fused_moe_bf16_tiled.py::test_sve_xbyak_pure_gemm_matches_static_asm
    benchmark: >-
      taskset -c 0
      optimizations/fused_moe_sve/benchmarks/run_jit_vs_i8mm_pure_gemm.sh
      --rows 1,2,4,8,12 --k 4096 --n 1024 --experts 1
      --warmup 32 --runs 201
    result: >-
      Arm-codex NUMA3 measurements on 2026-08-13 found 97.4-99.2 percent
      isolated M2040 efficiency through 32T. Under full 80-core occupancy,
      however, the best width depends on both route and stage; W13 M2040 peaks
