      csrc/moe_planner/bindings.cpp,
      cpu_moe_schedule_optimization/cost_model/analytic_model.py,
      cpu_moe_schedule_optimization/planners/interval_planner.py, and
      cpu_moe_schedule_optimization/planners/planned_moe.py
    hypothesis: >-
      Moving homogeneous heap LPT, candidate scoring, and winner selection to
      single-threaded C++, while retaining exact analytical cost rows in
      Python and converting only the selected candidate's full task payload,
      should reduce forced-miss planner overhead by at least 10 percent
      without changing the materialized Plan V2 or regressing cache hits by
      more than 2 percent.
    depends_on:
      - planner.quick_homogeneous_heap_lpt
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_moe_native_interval_planner.py tests/test_moe_cost_model_v2.py
      tests/test_moe_analytic_model.py
    benchmark: >-
      Run both m5 ranks concurrently with numactl --physcpubind=0-95
      --membind=0 and --physcpubind=96-191 --membind=1 using
      /tmp/bench_m5_real_routing_planner.py, the matching
      profiles/m5-tp2-rank{0,1}.json, 7 forced misses per layer, and
      /tmp/m5_tp2_dsv4_token_expert_ids_2048_20260816.json.
    result: >-
      Enabled on 2026-08-16. Across 43 real DSV4 layers, rank0/rank1
      forced-miss planner-overhead layer-medians fell from 35.633/35.378 ms
      to 31.998/31.739 ms; median per-layer gains were 10.15/10.01 percent.
      Immediate-hit planner overhead also improved by 9.68/9.27 percent.
      Full materialized Plan V2 JSON remained byte-identical on both ranks.
      See results/m5_tp2_dsv4_quick_planner_stages_20260816.md.

  - id: planner.native_quick_candidate_parallel
    part: dispatch
    status: diagnostic
    implementation: >-
      csrc/moe_planner/interval_planner.cpp,
      csrc/moe_planner/interval_planner.h,
      csrc/moe_planner/bindings.cpp, and
      cpu_moe_schedule_optimization/planners/interval_planner.py
    hypothesis: >-
      Evaluating the eight independent homogeneous candidates with fixed-index
      OpenMP workers may reduce forced-miss planner overhead by at least 10
      percent while preserving candidate order and fully materialized plans.
    depends_on:
      - planner.native_quick_search
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_moe_native_interval_planner.py tests/test_moe_cost_model_v2.py
      tests/test_moe_analytic_model.py
    benchmark: >-
      Sweep FUSED_CPP_MOE_PLANNER_THREADS=1,2,4,8 with both m5 ranks running
      concurrently, 7 forced misses per layer, matching rank profiles, and
      /tmp/m5_tp2_dsv4_token_expert_ids_2048_20260816.json.
    result: >-
      Not enabled by default on 2026-08-16. Relative to a same-binary 1-worker
      control, rank0/rank1 median per-layer forced-miss planner gains were
      0.19/0.15 percent at 2 workers, 0.13/-1.55 percent at 4 workers, and
      -0.26/0.80 percent at 8 workers. All were below the 10 percent gate.
      Explicit thread control remains available for diagnostics; quick planning
      defaults to one worker. Full Plan V2 JSON stayed byte-identical. See
      results/m5_tp2_dsv4_quick_planner_stages_20260816.md.

  - id: planner.analytic_resource_vectors
    part: dispatch
    status: enabled
    implementation: cpu_moe_schedule_optimization/cost_model/analytic_model.py
    hypothesis: >-
      Flattening each active analytical phase into one fixed-order resource
      demand/time vector and caching immutable isolated phase duration should
      remove repeated Python dictionaries in early-merge DAG simulation,
      improve forced-miss planner overhead by at least 2 percent, and preserve
      every scalar formula, event boundary, and materialized Plan V2 field.
    depends_on:
      - planner.native_quick_search
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_moe_native_interval_planner.py tests/test_moe_cost_model_v2.py
      tests/test_moe_analytic_model.py
    benchmark: >-
      Run both m5 ranks concurrently with the matching TP2 profiles,
      /tmp/m5_tp2_dsv4_token_expert_ids_2048_20260816.json, and 7 forced
      misses plus one immediate hit per layer.
    result: >-
      Enabled on 2026-08-16. Rank0/rank1 forced-miss planner-overhead
      layer-medians fell from same-binary 1-worker controls of 31.823/31.676 ms
      to 23.565/23.549 ms; paired median gains were 26.00/26.17 percent.
      Cache-hit planner overhead improved by 23.65/23.49 percent, and full
      materialized Plan V2 JSON remained byte-identical on both ranks. See
      results/m5_tp2_dsv4_quick_planner_stages_20260816.md.

  - id: planner.fixed_early_merge_on
    part: dispatch
    status: enabled
    implementation: >-
      cpu_moe_schedule_optimization/planners/interval_planner.py and
      cpu_moe_schedule_optimization/planners/planned_moe.py
    hypothesis: >-
      Materializing early_merge=true directly should preserve the effective
      runtime path for m5 TP2 DSV4 while removing the analytical completion-DAG
      and routing-tail gate from every cache miss and hit. Kernel latency must
      remain within 2 percent and forced-miss planner latency should improve by
      at least 10 percent.
    depends_on:
      - merge.async_ready_tokens
    conflicts_with: []
    correctness: >-
      PYTHONPATH=src .venv/bin/python -m pytest -q
      tests/test_moe_native_interval_planner.py tests/test_moe_cost_model_v2.py
      tests/test_moe_analytic_model.py
    benchmark: >-
      Run both m5 TP2 ranks concurrently on the 43-layer
      /tmp/m5_tp2_dsv4_token_expert_ids_2048_20260816.json routing capture,
      using 7 forced misses per layer for planner timing and 5 synchronized
      full-layer sweeps for planner-plus-kernel timing.
    result: >-
      Enabled on 2026-08-16. The previous auto policy resolved to on for all 43
      layers. Rank0/rank1 forced-miss planner layer-medians fell from
      23.565/23.549 ms to 1.424/1.401 ms, while the measured 43-layer kernel
      remained about 1.24 s. Synchronized forced-miss planner-plus-kernel
      medians fell from 2.973/2.968 s to 1.833/1.829 s, a 38.36/38.38 percent
      latency reduction. All 43 on/off/auto kernel outputs matched exactly.
      Historical TP4/F512 bimodal data favored disabling early merge by about
      6 percent, so the user-requested global fixed-on default retains a known
      cross-workload risk and is not presented as a model-derived optimum.
      See results/m5_tp2_dsv4_quick_planner_stages_20260816.md.

  - id: planner.native_cold_search
    part: dispatch
    status: enabled
    implementation: >-
      csrc/moe_planner/interval_planner.cpp,
      csrc/moe_planner/interval_planner.h,
      csrc/moe_planner/bindings.cpp,
      cpu_moe_schedule_optimization/planners/interval_planner.py, and
      cpu_moe_schedule_optimization/cost_model/phase_model.py
    hypothesis: >-
      Porting the schema-v2 empirical cost evaluation and pruned cold search
      to C++, then evaluating independent strict and tail-pool candidates with
      a bounded OpenMP team, removes Python event-simulation overhead without
      changing the candidate space, plan, or uncertainty tie-break.
    depends_on:
