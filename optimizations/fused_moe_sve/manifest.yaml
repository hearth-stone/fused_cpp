  - id: dispatch.timed_task_release
    part: dispatch
    status: retired
    implementation: Removed from the active tree; retained in Git history.
    history: 94e977d
    hypothesis: >-
      Lowering an offline cold-phase incumbent to contiguous strict Plan V2
      teams and enforcing each task's modeled release time can reproduce
      deliberate cold-weight staggering without changing GEMM kernels. Zero
      release retains the existing clock-free path; nonzero release is
